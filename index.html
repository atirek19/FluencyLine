const CFO_WEEKS = [
{t:"The CFO's job today", s:"What the role really is, and how people get there", days:[
 {t:"The four faces of the CFO", k:["Deloitte's widely used model describes four roles: steward (protect assets, accurate reporting, compliance), operator (run finance efficiently), strategist (shape company direction) and catalyst (drive change across the business).","Most CFOs are hired for strategist and catalyst, but fired for failures in steward and operator.","The modern CFO often also owns IT, procurement, risk or strategy, which makes technology fluency a real differentiator.","Boards judge a CFO on credibility of numbers, quality of capital allocation, and calm under pressure."], ex:"Rate yourself from 1 to 5 on each face, with one piece of evidence for each score. Which face is your current role building, and which is it not?", say:"I'd describe myself as strong on strategist and operator, and I'm deliberately building my steward credentials."},
 {t:"The finance organisation", k:["Typical reports to a CFO: Financial Controller (accounting, close, reporting), FP&A, Treasury, Tax, Investor Relations, Internal Audit (often dotted line to the audit committee), and sometimes Risk, Legal, IT and Procurement.","Shared services or global business services handle transactional work such as payables, receivables and payroll.","Finance business partners sit with business units and translate numbers into decisions.","A CFO's span is wide, so the job is mostly choosing strong heads for each tower and setting standards."], ex:"Sketch the finance organisation of your current company or a company you'd like to join. Which towers have you worked in, and which have you never touched?", say:"I've worked deeply in FP&A and corporate development. Controllership is the tower I'm building next."},
 {t:"Paths to the chair", k:["In India many CFOs come through chartered accountancy; a growing number come through an MBA with FP&A, strategy, corporate development or investment banking experience.","Common accelerators: owning a P&L or a business-unit finance role, leading an audit or close, raising capital, completing a major deal, and gaining board exposure.","Credentials people weigh: CA, US CPA or CMA, CFA, ACCA. They signal technical depth; they don't substitute for experience.","Typical progression: analyst, manager, finance business partner or FP&A lead, business-unit CFO or controller, VP Finance, then CFO."], ex:"List the next two roles that would sit between you and a CFO seat. For each, write what experience it would add that you don't have yet.", say:"My route isn't the classic CA route, so I'm collecting the experiences that make it credible: controllership, capital raising and board exposure."},
 {t:"Your gap analysis", k:["Strengths a strategy-and-FP&A background usually brings: planning, modelling, deal analysis, cost programmes, communicating numbers.","Common gaps for non-CA candidates: accounting standards, statutory audit, tax, treasury and regulatory compliance.","Your current IS role is an asset if you frame it right: technology cost governance, transformation delivery and cross-border leadership are CFO-relevant.","A deliberate plan beats a vague ambition: name the gap, the role or project that closes it, and the date."], ex:"Build a two-column table: CFO capabilities in one column, your evidence in the other. Mark each row green, amber or red. Pick the two reds you'll close first.", say:"My plan for the next two years closes two specific gaps: reporting and controls, and treasury."},
 {case:true, t:"Case: the mentor's challenge", k:["A senior CFO agrees to mentor you. In the first meeting they say: 'You're not a CA and you're currently running IS projects. Convince me you're on a credible CFO track.'"], ex:"Write the two-minute answer: your arc so far, why it adds up, the gaps you're closing, and what help you'd ask for.", say:"I'm not asking you to ignore the gaps. I'd like your advice on closing them faster."}
]},
{t:"Accounting and reporting", s:"Read and talk about financial statements like a controller", days:[
 {t:"Three statements, one story", k:["The income statement shows performance over a period; the balance sheet shows position at a point in time; the cash flow statement explains how cash moved.","Net income flows to retained earnings on the balance sheet and is the starting point of operating cash flow under the indirect method.","Non-cash items (depreciation, provisions) reduce profit but not cash; working capital changes move cash without touching profit.","Interviewers love asking how a single change flows through all three statements."], ex:"Take a ₹100 increase in depreciation with a 25% tax rate. Write how it changes each statement. Then check your answer against the hint on the Speak tab's interview question on this topic.", say:"Profit is an opinion and cash is a fact, so I always read the three statements together."},
 {t:"Revenue and leases", k:["Ind AS 115 / IFRS 15 recognises revenue in five steps: identify the contract, identify performance obligations, set the transaction price, allocate it, recognise revenue as each obligation is satisfied.","Multi-year service contracts, bundles and milestone billing are where judgement and audit questions concentrate.","Ind AS 116 / IFRS 16 puts most leases on the balance sheet as a right-of-use asset and a lease liability.","Lease accounting moves rent out of operating expenses into depreciation and interest, which raises reported EBITDA. Analysts often adjust for it."], ex:"Pick one contract type in your company, such as a multi-year SaaS subscription or a services retainer. Walk it through the five steps in plain words.", say:"Before we celebrate the EBITDA improvement, how much of it is lease accounting rather than operations?"},
 {t:"The close and consolidation", k:["The month-end close turns transactions into reliable statements: accruals, reconciliations, intercompany matching, review and sign-off.","Consolidation combines subsidiaries, eliminates intercompany transactions and translates foreign currencies.","Days to close is a common efficiency measure; fast closes rely on automation and clean master data.","In APAC groups, intercompany charges, multiple currencies and different statutory calendars make the close harder."], ex:"Ask a controller colleague for the close calendar. Note the three steps that take longest and why.", say:"What's driving our days to close: data, approvals, or intercompany reconciliation?"},
 {t:"Audit and internal controls", k:["The statutory auditor gives an opinion on whether the financial statements are true and fair.","India's Companies Act requires internal financial controls, and auditors report on controls over financial reporting; US-listed groups face SOX.","Key control themes: access, segregation of duties, approvals, reconciliations, change management in finance systems.","The audit committee oversees auditors and controls; a CFO's relationship with it is critical."], ex:"List five controls that protect revenue or payments in your organisation. Which depend on IT systems your team supports?", say:"I'd rather find the control gap ourselves than read about it in the management letter."},
 {case:true, t:"Case: the auditor's question", k:["During the year-end audit, the auditor challenges revenue recognised upfront on a three-year contract that includes implementation plus ongoing support.","The business head insists the deal was 'won and signed', so the revenue is real."], ex:"How do you analyse it under the five steps? What do you say to the business head? What do you tell the CFO and when?", say:"The deal is real. The question is timing, and the standard is clear about how we spread it."}
]},
{t:"FP&A that drives decisions", s:"Turn your existing strength into executive influence", days:[
 {t:"Driver-based planning and rolling forecasts", k:["Driver-based plans model the business through a few operational drivers (volumes, prices, headcount, utilisation) rather than line-by-line guesses.","Rolling forecasts look a fixed number of quarters ahead and update regularly, instead of freezing an annual budget.","Good forecasts are accurate, timely and explain what changed since last time.","Forecast accuracy and bias (consistently high or low) are worth tracking."], ex:"Pick one cost line you manage. Identify the two or three drivers that really explain it and rebuild the forecast from them.", say:"Let's forecast from the drivers, so when a number moves we already know why."},
 {t:"Variance analysis that explains", k:["Split revenue variances into price, volume and mix; split cost variances into rate and usage.","Separate timing differences from permanent ones.","Lead with the two variances that matter, not a list of twenty.","Always end with the action: what are we changing because of this?"], ex:"Take last month's biggest variance in your area. Split it into price, volume and mix or rate and usage, and write the one-line action.", say:"Two-thirds of the miss is mix, not volume, which changes what we should do about it."},
 {t:"Unit economics", k:["Contribution margin: revenue minus variable costs, per unit, customer or contract.","Customer acquisition cost, lifetime value and payback period are standard for subscription businesses.","Cost-to-serve analysis often reveals unprofitable customers or services.","Unit economics connect operational choices to profit in a way boards remember."], ex:"For one service your organisation provides, estimate revenue, variable cost and contribution per unit. Is any segment loss-making?", say:"At the unit level this service is profitable; the loss comes from how we allocate fixed costs."},
 {t:"Scenarios, sensitivities and zero-based budgeting", k:["Scenario planning tests the plan against a few coherent futures; sensitivity analysis flexes one variable at a time.","Present the base case plus the scenarios that would change a decision.","Zero-based budgeting builds costs from zero each cycle, forcing justification of every line; it works best on discretionary spend.","Your IT cost and chargeback experience is directly relevant to ZBB conversations."], ex:"Build a simple three-scenario view (base, downside, upside) for your area's budget, with the trigger that would move you from one to another.", say:"In the downside case we'd pull these three levers, in this order."},
 {case:true, t:"Case: why did EBITDA miss?", k:["Quarterly EBITDA came in 8% below forecast.","The CEO wants a clear explanation in tomorrow's leadership meeting, and each business head has a different story."], ex:"How do you structure the bridge from forecast to actual? Which three questions do you ask business heads tonight? What does your one-slide answer look like?", say:"Here's the bridge: three items explain 90% of the miss, and only one of them is likely to repeat."}
]},
{t:"Cash, working capital and treasury", s:"The part of finance that keeps a company alive", days:[
 {t:"Cash versus profit", k:["A profitable company can still run out of cash if receivables grow faster than collections.","Free cash flow is operating cash flow minus capital expenditure; many investors value companies on it.","Cash flow from operations, investing and financing tell different stories about the business.","CFOs are judged heavily on cash discipline in tough markets."], ex:"Look at your company's (or a listed peer's) last annual report. Compare net profit and operating cash flow for two years. What explains the difference?", say:"Our profit grew, but operating cash didn't. Receivables explain most of the gap."},
 {t:"Working capital and the cash conversion cycle", k:["Cash conversion cycle = days sales outstanding + days inventory outstanding − days payables outstanding.","Lower DSO means you collect faster; higher DPO means you pay slower, within terms and supplier relationships.","Services businesses mostly manage receivables and unbilled revenue rather than inventory.","Small improvements in DSO can release large amounts of cash."], ex:"Estimate DSO for your business or a peer. Calculate how much cash a 10-day improvement would release.", say:"Cutting ten days off DSO releases more cash than this year's cost programme."},
 {t:"The 13-week cash forecast", k:["A rolling 13-week direct cash forecast shows receipts and payments week by week.","It's the core tool in tight liquidity or covenant situations.","Accuracy comes from talking to collections, payables and payroll teams, not just the ledger.","Variance to last week's forecast teaches you where your assumptions are wrong."], ex:"Sketch the structure of a 13-week cash forecast for a services company: receipt lines, payment lines, opening and closing cash, minimum balance.", say:"Our 13-week view shows the pinch point in week seven, so we're acting now."},
 {t:"Treasury basics", k:["Treasury manages liquidity, banking relationships, funding, investments and financial risk.","FX risk arises when revenues and costs are in different currencies; forwards and options are common hedges.","Interest rate risk affects floating-rate debt.","In APAC groups, cash pooling, repatriation rules and withholding taxes shape where cash sits."], ex:"Identify one currency exposure in your organisation, such as INR costs against USD or EUR revenue. How is it managed today?", say:"Our exposure is mostly transactional, so a rolling hedge on forecast flows makes more sense than speculating on the rate."},
 {case:true, t:"Case: the 90-day delay", k:["Your largest customer announces it will pay 90 days late for the next two quarters.","Your loan covenant requires a minimum liquidity level, and headroom is thin."], ex:"What do you do in the first week? Which levers can you pull across receivables, payables, spend and funding? How do you brief the board and the bank?", say:"We've identified the gap, the levers that close it, and when we'll talk to the bank, before they hear it elsewhere."}
]},
{t:"Capital, valuation and allocation", s:"How CFOs decide where money goes", days:[
 {t:"Cost of capital", k:["WACC blends the cost of equity and the after-tax cost of debt by their weights.","Cost of equity is often estimated with CAPM: risk-free rate plus beta times the equity risk premium.","Debt is cheaper than equity because of tax deductibility and seniority, but too much raises risk.","Investments must earn more than the cost of capital to create value."], ex:"Find the risk-free rate (Indian 10-year government bond yield) and estimate a cost of equity for a company you know, stating your assumptions.", say:"This project clears our hurdle rate, but only just, so the downside case matters."},
 {t:"Valuation: DCF and multiples", k:["A DCF values a business by discounting forecast free cash flows and a terminal value.","Multiples such as EV/EBITDA and P/E compare a company with peers or past transactions.","Enterprise value belongs to all capital providers; equity value is what's left for shareholders after net debt.","Most of a DCF's value often sits in the terminal value, so test those assumptions hardest."], ex:"For one listed company, find its EV/EBITDA and compare it with two peers. What might explain the difference?", say:"The DCF and the trading multiples point to a similar range, which gives me some confidence."},
 {t:"Capital allocation", k:["Capital allocation choices: reinvest in the business, acquire, pay down debt, pay dividends, buy back shares.","Return on invested capital compared with WACC shows whether growth creates value.","NPV, IRR and payback each answer a different question; NPV is the most reliable for value.","Good CFOs kill projects as readily as they approve them."], ex:"Take one IS project in your portfolio and evaluate it with NPV, IRR and payback. Which measure would a CFO weight most, and why?", say:"Positive NPV, but a long payback. Let's look at whether we can phase the investment."},
 {t:"Debt and funding", k:["Common instruments: term loans, working capital facilities, bonds and non-convertible debentures in India.","Covenants (leverage, interest cover, minimum liquidity) protect lenders and constrain the company.","Credit ratings affect cost and access to debt.","The right capital structure depends on cash flow stability, growth plans and risk appetite."], ex:"Read the borrowings note in a listed company's annual report. List the instruments, rates and any covenants mentioned.", say:"We have headroom on leverage, but interest cover is the covenant to watch if rates rise."},
 {case:true, t:"Case: three uses for the same money", k:["The board has surplus cash and three proposals: a buyback, an acquisition in an adjacent market, or paying down expensive debt."], ex:"What analysis would you run for each? What non-financial factors matter? What recommendation structure would you bring to the board?", say:"Here's how each option compares on value, risk and flexibility, and why I recommend this sequence."}
]},
{t:"M&A and corporate development", s:"Build on your deal experience to CFO level", days:[
 {t:"The deal lifecycle", k:["Strategy and thesis, target screening, approach, valuation, due diligence, negotiation and SPA, approvals, closing, integration.","A clear deal thesis states why this target, why now, and why we are the right owner.","Due diligence spans financial, tax, legal, commercial, technology, HR and increasingly cyber and ESG.","Most value is created or destroyed after closing, in integration."], ex:"Write the deal thesis for an acquisition you've worked on or read about, in three sentences.", say:"Before we talk price, can we agree the thesis in three sentences?"},
 {t:"Synergies and why they disappoint", k:["Cost synergies (procurement, duplicate functions, IT consolidation) are more reliable than revenue synergies.","Synergies need owners, timelines and one-off costs to achieve them.","Overpaying for synergies hands the value to the seller.","Technology integration is often the slowest and most expensive part. Your IS experience is valuable here."], ex:"For one deal, list three cost synergies and three revenue synergies with a realistic timeline and one-off cost for each.", say:"I'd only pay for the cost synergies; revenue synergies are upside."},
 {t:"SPA terms that matter", k:["Representations and warranties state facts about the business; indemnities cover specific known risks.","Earn-outs bridge valuation gaps by paying more if targets are met, but often cause disputes.","Conditions precedent, material adverse change clauses and locked-box or completion accounts mechanisms shape risk and price.","Escrows and holdbacks protect the buyer after closing."], ex:"For a deal you know, note which risks were handled by price, which by indemnity, and which by an earn-out.", say:"That risk is known, so I'd rather cover it with a specific indemnity than a general warranty."},
 {t:"Post-merger integration", k:["Day 1 must be flawless: payroll, customer continuity, legal entity, communications, access to systems.","Day 100 plans deliver early synergies and settle the operating model.","An integration management office tracks workstreams, risks and synergies, just like a PMO.","Culture and key-person retention decide whether the deal works."], ex:"Draft a one-page Day 1 readiness checklist for an acquisition, covering finance, HR, IT, legal and customers.", say:"Integration is a programme, not an afterthought. Here's the governance I'd set up."},
 {case:true, t:"Case: numbers that look too good", k:["A target's EBITDA margin is ten points above peers, and growth has accelerated in the year before sale.","The seller wants exclusivity signed within two weeks."], ex:"Which diligence questions do you prioritise? What quality-of-earnings adjustments would you look for? What would make you walk away?", say:"Before exclusivity, I need comfort on quality of earnings: one-offs, capitalised costs and customer concentration."}
]},
{t:"Tax, regulation and governance", s:"The rules a CFO signs their name to", days:[
 {t:"Tax fluency", k:["India's GST has central, state and integrated components, with input tax credit preventing tax on tax.","Direct tax covers corporate income tax, withholding taxes and advance tax.","The effective tax rate differs from the statutory rate because of incentives, losses and non-deductible items.","A CFO needs to ask the right tax questions early, especially in deals and cross-border flows."], ex:"Find one company's effective tax rate and statutory rate. List possible reasons for the gap.", say:"Has tax reviewed this structure before we commit, including GST and withholding?"},
 {t:"Transfer pricing and global minimum tax", k:["Transfer pricing requires intercompany transactions to be priced at arm's length, with documentation.","APAC groups often charge for management services, IT and royalties across borders, which tax authorities scrutinise.","The OECD's Pillar Two sets a 15% global minimum tax for large groups with revenue of €750 million or more; countries are implementing it on different timelines.","IT chargebacks between entities are a transfer pricing question, not just an internal accounting one."], ex:"List the intercompany charges that touch IS in your region. Who documents them, and on what basis are they priced?", say:"Our IT chargeback crosses borders, so it needs transfer pricing support, not just a cost allocation key."},
 {t:"The CFO's legal role in India", k:["Under the Companies Act 2013, the CFO is key managerial personnel.","For listed companies, SEBI's listing regulations require the CEO and CFO to certify the financial results and the adequacy of internal controls.","Related party transactions need approvals and disclosure.","Personal accountability is real; strong controls protect the CFO as much as the company."], ex:"Read the CEO/CFO certification in a listed company's annual report. Write down what the CFO is personally confirming.", say:"I'll only certify what our controls can actually support, so let's close this gap before quarter end."},
 {t:"Boards and audit committees", k:["The audit committee oversees financial reporting, auditors, internal controls and risk.","Independent directors expect clear, honest papers with the decision and the risks up front.","Never surprise a board; pre-brief the chair on difficult news.","Board exposure is one of the biggest accelerators towards a CFO role. Seek chances to present."], ex:"Rewrite one of your steering committee papers as if it were going to an audit committee: purpose, decision, key risks, recommendation, in one page.", say:"The paper asks for one decision and sets out the risks of each option."},
 {case:true, t:"Case: the challenged charge", k:["A tax authority in one APAC country challenges the IT services charge your regional HQ bills to the local entity, calling it excessive.","The local finance head wants to stop paying the charge immediately."], ex:"What do you check first? Who needs to be involved? What do you advise the local finance head, and what changes for next year?", say:"Stopping payment creates new problems. Let's check the documentation and the benefit test first."}
]},
{t:"Risk, controls and ESG", s:"Protecting value and reporting beyond the numbers", days:[
 {t:"Enterprise risk management", k:["ERM identifies, assesses and manages risks across the company against an agreed risk appetite.","Risk registers rank risks by likelihood and impact, with owners and mitigations, similar to a RAID log at company level.","Key risk indicators warn early.","Boards increasingly expect technology, cyber and supply chain risks to be quantified in financial terms."], ex:"Take your top five project risks and restate each in financial terms: what's the exposure in rupees or euros?", say:"Expressed in money, this cyber risk is bigger than our largest FX exposure."},
 {t:"Three lines and fraud risk", k:["The IIA's Three Lines Model: management owns risk, risk and compliance functions oversee it, internal audit gives independent assurance.","Fraud needs pressure, opportunity and rationalisation (the fraud triangle); controls reduce opportunity.","Common fraud areas: expenses, procurement, revenue manipulation, payroll.","Data analytics now detects anomalies across full populations, not just samples."], ex:"Name one process in your area where segregation of duties is weak. What compensating control exists?", say:"I'd like analytics on the full population of payments, not a sample."},
 {t:"ESG reporting", k:["India requires the Business Responsibility and Sustainability Report (BRSR) for its top 1,000 listed companies, with BRSR Core assurance phasing in.","The ISSB's IFRS S1 and S2 set global baselines for sustainability and climate disclosure; several APAC jurisdictions are adopting them.","The EU's CSRD affects many groups with European operations, though its scope is being revised.","Finance increasingly owns ESG data quality and assurance, much like financial data."], ex:"Read your company's or a peer's sustainability report. Note which numbers look assured and which don't.", say:"If we're going to publish it, it needs the same data discipline as our financial numbers."},
 {t:"Technology risk as financial risk", k:["Cyber incidents, outages and failed implementations show up in the P&L, in disclosures and sometimes in valuations.","ERP failures have caused restatements and missed results at well-known companies.","CFOs increasingly co-own technology investment decisions and their risks.","This is where your tech line and CFO line meet: you can speak both languages."], ex:"Write a short note to a CFO explaining one current IS risk in your area, its financial exposure, and what it would cost to reduce it.", say:"This isn't an IT issue, it's a revenue-at-risk issue. Here's the number."},
 {case:true, t:"Case: the whistleblower", k:["An anonymous complaint alleges that a country manager has been approving inflated vendor invoices from a related company."], ex:"What are your first steps? Who must be informed, and who must not? How do you preserve evidence and protect the whistleblower?", say:"We'll handle this through the formal process: independent, confidential and documented."}
]},
{t:"Investors and capital markets", s:"Telling the financial story outside the company", days:[
 {t:"The equity story", k:["An equity story explains why the company will create value: market, edge, growth drivers, margins, capital allocation and management.","Consistency builds credibility; changing the story every quarter destroys it.","KPIs disclosed to investors should be ones management actually runs the business on.","Your IPO documentation experience is directly relevant here."], ex:"Write a five-sentence equity story for your company or a listed company you admire.", say:"Our story is simple: a growing market, a durable edge, and disciplined capital allocation."},
 {t:"Earnings, guidance and analyst calls", k:["Guidance sets expectations; missing your own guidance hurts more than missing analysts' estimates.","Prepare for earnings calls with likely questions and agreed answers, and never improvise on numbers.","Bridge charts and non-GAAP measures help, if reconciled and used consistently.","Bad news is best delivered early, clearly and with a plan."], ex:"Read the transcript of a recent earnings call of an Indian listed company. Note the three toughest analyst questions and how the CFO answered.", say:"We're lowering guidance for two specific reasons, and here's what we're doing about each."},
 {t:"The IPO journey", k:["In India, the DRHP is filed with SEBI, then the RHP before the issue opens, followed by the prospectus.","Bankers, lawyers, auditors and the company build the offer document, financial disclosures and risk factors.","Anchor investors, pricing, allotment and lock-ins shape the listing.","Being public adds quarterly reporting, disclosure obligations and constant market scrutiny."], ex:"Outline the IPO timeline from appointing bankers to listing day, and mark where finance carries the heaviest load.", say:"The IPO isn't the finish line; it's the start of quarterly accountability."},
 {t:"Numbers for non-finance audiences", k:["Lead with the insight, then the number, then the method only if asked.","Round numbers and use comparisons people can feel.","One chart, one message.","The CFO who can explain finance simply becomes the CEO's most trusted partner."], ex:"Take a complex number from your work (a cost allocation, a business case) and explain it in three sentences to someone with no finance background.", say:"In plain terms: for every rupee we put in, we expect about one and a half back within three years."},
 {case:true, t:"Case: the guidance cut", k:["You must explain a 6% cut to annual revenue guidance on tomorrow's analyst call.","Two causes: a delayed large contract and weaker demand in one market."], ex:"Draft the opening statement (about 150 words). List the five toughest questions you expect and your answer to each.", say:"We're being specific about what changed, what didn't, and what we're doing."}
]},
{t:"Finance transformation", s:"The digital CFO, and your bridge from IS to finance", days:[
 {t:"The finance operating model", k:["Modern finance splits into transactional processing (often global business services), centres of excellence (tax, treasury, reporting) and business partnering.","Shared services and GBS centres in India serve many global groups.","The aim is lower cost per transaction, faster close and more time for insight.","Your shared services and chargeback experience fits squarely here."], ex:"Map your company's finance operating model into these three layers. Where are the biggest inefficiencies?", say:"We should spend less time producing numbers and more time explaining them."},
 {t:"ERP and EPM for finance", k:["ERP finance modules (SAP S/4HANA, Oracle Fusion, Dynamics 365) hold the general ledger and transactions.","Enterprise performance management tools (Anaplan, Oracle EPM, OneStream, SAP Analytics Cloud, Workday Adaptive Planning) handle planning, consolidation and reporting.","Clean master data and a sound chart of accounts matter more than the tool.","Finance system projects are IS projects with finance stakes, exactly where you sit today."], ex:"List the finance systems your organisation uses and how data flows between them. Where is the manual spreadsheet glue?", say:"The tool won't fix the process. Let's agree the chart of accounts and data owners first."},
 {t:"AI and automation in finance", k:["Common uses: invoice processing, reconciliations, anomaly detection, forecasting, close commentary and contract review.","Generative AI can draft variance commentary and board summaries, but needs review and grounding in real data.","Controls and auditability must extend to automated and AI-assisted steps.","Measure value in close days saved, accuracy and analyst time released."], ex:"Identify three finance tasks in your organisation that are good automation candidates. Score each on value, feasibility and control risk.", say:"Automate the reconciliation, keep a human on the judgement, and log both for audit."},
 {t:"Your bridge move", k:["Roles that bridge IS and finance: finance transformation lead, IT finance business partner, finance systems programme director, controller of a technology-heavy business.","Your differentiator: you can run a transformation and read a P&L, and few candidates can do both.","Build visible finance credentials now: own the IS budget narrative, present to finance leadership, volunteer for close or audit-related projects.","Time the move when you have a quantified transformation win to point to."], ex:"Write your bridge plan: the target role, three actions in the next six months, and the result you'll be able to quote.", say:"I've delivered transformation inside IS; the next step is to lead it inside finance."},
 {case:true, t:"Case: why a PMO person?", k:["You're interviewing for a Head of Finance Transformation role. The CFO says: 'Our last transformation lead was a CA. Why should we pick someone from an IS PMO?'"], ex:"Prepare a 90-second answer that turns your background into the reason to hire you, with two quantified examples.", say:"Because the hard part of finance transformation isn't the accounting, it's delivery, and I bring both."}
]}
];

function md(text){
  const lines = esc(text).split(/\n/); let html="", inList=false;
  for(let ln of lines){
    ln = ln.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
    if(/^\s*#{1,4}\s+/.test(ln)){ if(inList){html+="</ul>";inList=false;} html+="<h3>"+ln.replace(/^\s*#{1,4}\s+/,"")+"</h3>"; }
    else if(/^\s*[-*•]\s+/.test(ln)){ if(!inList){html+="<ul>";inList=true;} html+="<li>"+ln.replace(/^\s*[-*•]\s+/,"")+"</li>"; }
    else if(ln.trim()===""){ if(inList){html+="</ul>";inList=false;} }
    else { if(inList){html+="</ul>";inList=false;} html+="<p>"+ln+"</p>"; }
  }
  if(inList) html+="</ul>";
  return html;
}

/* ---------- Claude calls ---------- */
async function aiText(input, opts){
  opts = opts||{};
  if(SAMPLE){
    const o = {};
    if(opts.onText) o.onText = opts.onText;
    if(opts.tier) o.modelTier = opts.tier;
    if(opts.cache !== undefined) o.cache = opts.cache;
    if(opts.signal) o.signal = opts.signal;
    const r = await SAMPLE(input, o); return {text:r.text, truncated:r.truncated, sources:[]};
  }
  const key = apiKey(); if(!key) throw {code:"no_ai"};
  const messages = typeof input==="string" ? [{role:"user",content:input}] : input;
  const body = {model:apiModel(), max_tokens:opts.max||1400, messages:messages};
  if(opts.search) body.tools = [{type:"web_search_20250305", name:"web_search", max_uses:opts.uses||5}];
  let res, data;
  try{
    res = await fetch("https://api.anthropic.com/v1/messages", {method:"POST", signal:opts.signal, headers:{"content-type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"}, body:JSON.stringify(body)});
  }catch(e){ if(e && e.name==="AbortError") throw {code:"cancelled"}; throw {code:"network"}; }
  try{ data = await res.json(); }catch(e){ data = {}; }
  if(!res.ok){
    const msg = (data && data.error && data.error.message) || ("HTTP "+res.status);
    throw {code: res.status===401||res.status===403 ? "bad_key" : res.status===429 ? "rate_limited" : res.status>=500 ? "upstream_error" : "api_error", message:msg};
  }
  const blocks = (data.content||[]).filter(b=>b.type==="text");
  const sources = []; const seen = new Set();
  blocks.forEach(b=>(b.citations||[]).forEach(c=>{ if(c.url && !seen.has(c.url)){ seen.add(c.url); sources.push({u:c.url, t:c.title||c.url}); } }));
  const text = blocks.map(b=>b.text).join("").trim();
  if(!text) throw {code:"empty_completion"};
  if(opts.onText) opts.onText({text:text});
  return {text:text, truncated:data.stop_reason==="max_tokens", sources:sources};
}
function errHTML(e){
  const code = e && e.code;
  if(code==="api_error") return '<p class="hint">The API returned an error: '+esc(e.message||"")+'. If it mentions the model, pick another model in Settings.</p>';
  return '<p class="hint">'+esc(ERR[code]||"Couldn't get an answer. Tap the button to try again.")+'</p>';
}
async function askAI(prompt, out, opts){
  opts = opts||{};
  if(!aiOn()){ out.innerHTML = '<p class="thinking">'+esc(noAiNote())+'</p>'; return null; }
  out.innerHTML = '<p class="thinking">Thinking…</p>';
  const btn = opts.button; if(btn) btn.disabled = true;
  try{
    const r = await aiText(prompt, Object.assign({}, opts, {onText:({text})=>{ out.innerHTML = md(text); }}));
    out.innerHTML = md(r.text) + sourcesHTML(r.sources) + (r.truncated? '<p class="hint">Cut short. Ask for less at a time.</p>':'');
    return r;
  }catch(e){
    if(e && e.code==="cancelled"){ out.innerHTML=""; return null; }
    out.innerHTML = (e && e.text && e.code!=="refused" ? md(e.text) : "") + errHTML(e);
    return null;
  }finally{ if(btn) btn.disabled = false; }
}
function sourcesHTML(src){ if(!src||!src.length) return ""; return '<h3>Sources</h3><ul>'+src.slice(0,8).map(s=>'<li><a href="'+esc(s.u)+'" target="_blank" rel="noopener">'+esc(s.t)+'</a></li>').join("")+'</ul>'; }

let hnState = {status:"idle", items:[]};
async function loadHeadlines(force){
  if(!STANDALONE) return;
  const cached = (()=>{ try{ return JSON.parse(lget("hn","null")); }catch(e){ return null; } })();
  const sig = today()+"|"+weekOf("tech")+"|"+weekOf("cfo");
  if(!force && cached && cached.sig===sig){ hnState = {status:"ok", items:cached.items}; return; }
  if(hnState.status==="loading") return;
  hnState = {status:"loading", items:[]};
  const since = Math.floor(Date.now()/1000) - 3*86400;
  const kws = HN_KEYS.tech[weekOf("tech")-1].concat(HN_KEYS.cfo[weekOf("cfo")-1]);
  try{
    const results = await Promise.all(kws.map((k,i)=>fetch("https://hn.algolia.com/api/v1/search?tags=story&hitsPerPage=6&query="+encodeURIComponent(k)+"&numericFilters="+encodeURIComponent("created_at_i>"+since+",points>10"))
      .then(r=>r.ok?r.json():{hits:[]}).then(j=>(j.hits||[]).map(h=>({id:h.objectID, t:h.title, u:h.url||("https://news.ycombinator.com/item?id="+h.objectID), p:h.points||0, lane:i<2?"tech":"cfo"}))).catch(()=>[])));
    const seen = new Set(); let items = [];
    results.flat().forEach(h=>{ if(h.t && !seen.has(h.id)){ seen.add(h.id); items.push(h); } });
    items.sort((a,b)=>b.p-a.p); items = items.slice(0,10);
    hnState = {status: items.length? "ok":"empty", items:items};
    if(items.length) lset("hn", JSON.stringify({sig:sig, items:items}));
  }catch(e){ hnState = {status:"error", items:[]}; }
  if(tab==="pulse" || tab==="today") render();
}
function headlinesHTML(max){
  if(!STANDALONE) return "";
  if(hnState.status==="loading" || hnState.status==="idle") return '<p class="hint">Loading live headlines…</p>';
  if(hnState.status==="error"||hnState.status==="empty") return '<p class="hint">No live headlines right now. Check your connection, or use the sources below.</p>';
  return '<ul class="src">'+hnState.items.slice(0,max||10).map(h=>'<li class="hl"><a href="'+esc(h.u)+'" target="_blank" rel="noopener"><b>'+esc(h.t)+'</b><span>'+(h.lane==="cfo"?"Business and finance":"Technology")+', '+h.p+' points</span></a><button class="btn ghost small dec" data-dec="'+esc(h.t)+'">Decode</button></li>').join("")+'</ul><p class="hint">From Hacker News, filtered to this week\'s topics on both lines. It leans towards tech; use the sources below for Indian business news.</p>';
}

function addCustomCard(term, text){

function stopTimer(){ setTimer(null); clearInterval(timer); timer=null; }
function startTick(){
  clearInterval(timer);
  const tm = getTimer(); if(!tm) return;
  const tick = ()=>{
    const c = $("#clock"); if(!c) return;
    const el = Math.floor((Date.now()-tm.start)/1000), left = Math.max(0, 45*60-el);
    c.textContent = String(Math.floor(left/60)).padStart(2,"0")+":"+String(left%60).padStart(2,"0");
    let acc=0, ph=PHASES.length-1;
    for(let i=0;i<PHASES.length;i++){ acc+=PHASES[i].m*60; if(el<acc){ ph=i; break; } }
    $("#phaseLbl").textContent = left===0 ? "Time's up. Lock in and mark complete." : "Now: "+PHASES[ph].n+" ("+PHASES[ph].m+" min)";
    document.querySelectorAll(".phase").forEach(p=>p.classList.toggle("live", +p.dataset.ph===ph && left>0));
    if(left===0) clearInterval(timer);
  };
  tick(); timer = setInterval(tick, 1000);
}

      $("#got").onclick=()=>{ const r=S.cards[c.id]; const b=Math.min((r?r.b:0)+1,5); S.cards[c.id]={b:b,d:addDays(today(),GAPS[b])}; i++; shown=false; save(); draw(); };
    }

function quizSession(){
  const pool = unlockedCards(); const all = allCards();
  if(pool.length<4){ sheet("Quick quiz","<p>Unlock a few more cards first.</p>"); return; }
  const pick = arr=>arr[Math.floor(Math.random()*arr.length)];
  const qs = [], used = new Set();
  while(qs.length<3){ const c=pick(pool); if(used.has(c.id)) continue; used.add(c.id);
    const opts=[c]; while(opts.length<4){ const o=pick(all); if(!opts.includes(o)) opts.push(o); }
    qs.push({c:c, o:opts.sort(()=>Math.random()-.5)}); }
  let i=0, score=0;
  const draw=()=>{
    const body=$("#sheetBody").querySelector(".sbody");
    if(i>=qs.length){ markActive(); save(); body.innerHTML='<h2>'+score+' of 3</h2><p>'+(score===3?'Clean sweep.':'The ones you missed are now due again in your cards.')+'</p><div class="btns"><button class="btn primary" id="qfin">Close</button></div>'; $("#qfin").onclick=()=>{closeSheet(); render();}; return; }
    const q=qs[i];
    body.innerHTML='<div class="count">Question '+(i+1)+' of 3</div><h2 style="margin-bottom:12px">What does "'+esc(q.c.t)+'" mean?</h2>'+q.o.map((o,j)=>'<button class="opt" data-j="'+j+'">'+esc(o.d)+'</button>').join("");
    body.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      const ok = q.o[+b.dataset.j]===q.c;
      body.querySelectorAll(".opt").forEach((x,j)=>{ x.disabled=true; if(q.o[j]===q.c) x.classList.add("right"); });
      if(!ok){ b.classList.add("wrong"); S.cards[q.c.id]={b:1,d:today()}; save(); } else score++;
      const nx=document.createElement("button"); nx.className="btn primary"; nx.textContent=i<2?"Next question":"See score"; nx.style.marginTop="6px"; nx.onclick=()=>{i++; draw();}; body.appendChild(nx);
    });
  };
  sheet("Quick quiz","",draw);
}

      '<ul class="phr">'+s.p.map(x=>'<li>'+esc(x)+'</li>').join("")+'</ul>';
  } else {
    body = '<p class="lede">A practice partner who pushes back. Includes an HR interviewer and a hiring CFO.</p>'+
      '<p class="hint ai-off">'+esc(noAiNote())+' Until then, pick a persona and rehearse your reply out loud.</p>'+
      '<div class="chips cwrap" role="group" aria-label="Personas">'+ALLPERSONAS.map(p=>'<button class="chip" data-per="'+p.id+'" aria-pressed="'+(!!persona&&persona.id===p.id)+'">'+esc(p.n)+'</button>').join("")+'</div>'+
      (persona? '<div class="chat" id="chat"><div class="msg them"><span class="who">'+esc(persona.n)+'</span>'+esc(persona.o)+'</div>'+chat.map(m=>'<div class="msg '+(m.role==="user"?"me":"them")+'">'+(m.role==="user"?"":'<span class="who">'+esc(persona.n)+'</span>')+esc(m.content)+'</div>').join("")+'</div>'+
        '<div class="ai-only"><textarea class="field" id="chatIn" placeholder="Your reply (dictate it to practise speaking)" style="min-height:80px"></textarea>'+
        '<div class="btns"><button class="btn primary" id="chatSend">Send</button><button class="btn ghost" id="chatDebrief">Debrief me</button><button class="btn ghost" id="chatReset">Start over</button></div></div>'
       : '<p class="hint">Choose who you want to practise with.</p>');
  }
  return '<h1>Speak</h1><div class="seg" role="group" aria-label="Practice type">'+segs.map(s=>'<button data-seg="'+s[0]+'" aria-pressed="'+(s[0]===speakSeg)+'">'+s[1]+'</button>').join("")+'</div><div class="sec">'+body+'</div>';
}
function rulesFor(p){ return profile()+"\n\nRole-play for practice. You are "+p.d+" Stay in character. Reply as a real person would: 2 to 4 sentences, natural spoken English, realistic pushback, no stage directions. You opened the scene by saying: \""+p.o+"\"\n\nIf the learner's message is exactly DEBRIEF, step out of character and coach them with headings: ### What landed ### What to say differently ### Two phrases to reuse. Under 220 words."; }
async function sendChat(text, debrief){
  if(!aiOn()) return;
  const turns = [{role:"user", content:rulesFor(persona)}];
  chat.slice(-16).forEach(m=>turns.push({role:m.role, content:m.content}));
  turns.push({role:"user", content: debrief? "DEBRIEF" : text});
  if(!debrief) chat.push({role:"user", content:text});
  const box = $("#chat");
  if(!debrief){ const me=document.createElement("div"); me.className="msg me"; me.textContent=text; box.appendChild(me); }
  const b = document.createElement("div"); b.className="msg them"; b.innerHTML='<span class="who">'+esc(debrief?"Coach":persona.n)+'</span><span class="tx">Thinking…</span>'; box.appendChild(b);
  b.scrollIntoView({block:"end", behavior:"smooth"});
  const send=$("#chatSend"), deb=$("#chatDebrief"); send.disabled=true; deb.disabled=true;
  chatCtl = new AbortController();
  try{
    const r = await aiText(turns, {cache:false, tier:"quick", signal:chatCtl.signal, max:700, onText:({text})=>{ b.querySelector(".tx").innerHTML = debrief? md(text) : esc(text); }});
    if(!debrief) chat.push({role:"assistant", content:r.text}); else b.querySelector(".tx").innerHTML = md(r.text);
    markActive(); save();
  }catch(e){
    if(e && e.code==="cancelled") return;
    b.querySelector(".tx").innerHTML = errHTML(e);
    if(!debrief) chat.pop();
  }finally{ if(document.body.contains(send)){ send.disabled=false; deb.disabled=false; } }
}

/* ---------- Pulse ---------- */
function vPulse(){
  const s = SOURCES[hash(today())%SOURCES.length];
  return '<h1>Pulse</h1><p class="lede">Current awareness in small doses: scan, pick one item, decode it, keep the talking point.</p>'+
  '<div class="sec"><p>This week\'s lenses: <b>'+esc(WEEKS[weekOf("tech")-1].t)+'</b> on the tech line and <b>'+esc(CFO_WEEKS[weekOf("cfo")-1].t)+'</b> on the CFO line.</p></div>'+
  (STANDALONE? '<div class="sec"><h2>Today\'s briefing</h2>'+briefHTML()+'</div><div class="sec"><h2>Live headlines</h2>'+headlinesHTML(10)+'</div>' : '')+
  '<div class="sec ask"><label for="hl">Decode a headline</label><textarea class="field" id="hl" placeholder="Paste a headline or the first paragraph of an article" style="min-height:90px"></textarea>'+
  '<div class="btns ai-only"><button class="btn primary small" id="hlGo">Decode it</button></div>'+
  '<p class="hint ai-off">'+esc(noAiNote())+'</p>'+
  '<p class="hint">The decoder works only from the text you paste, so verify anything you plan to repeat.</p><div class="out" id="hlOut"></div></div>'+
  '<div class="sec"><h2>Today\'s pick: '+esc(s.n)+'</h2><p class="lede">'+esc(s.w)+'</p><div class="btns"><a class="btn signal small" href="'+s.u+'" target="_blank" rel="noopener">Open '+esc(s.n)+'</a></div></div>'+
  '<div class="sec"><h2>All sources</h2><ul class="src">'+SOURCES.map(x=>'<li><a href="'+x.u+'" target="_blank" rel="noopener"><span><b>'+esc(x.n)+'</b><span>'+esc(x.w)+'</span></span><span class="go">Open</span></a></li>').join("")+'</ul></div>';
}
function decode(out, btn, src){
  const t = (src||"").trim(); if(t.length<12){ toast("Paste a headline first"); return Promise.resolve(null); }
  return askAI(profile()+"\n\nThey read this headline or excerpt:\n\"\"\"\n"+t.slice(0,6000)+"\n\"\"\"\nWork only from this text and general knowledge; don't invent details. Headings: ### What it means (3 plain sentences) ### Why it matters to an APAC enterprise IS portfolio or a finance leader (2 to 3 bullets) ### A question to ask my team ### A line I could say in a meeting or an interview. Under 220 words.", out, {button:btn});
}

/* ---------- Me ---------- */
function vMe(){
  const days=[]; for(let i=27;i>=0;i--) days.push(addDays(today(),-i));
  const bc = d=>Object.keys(S.bursts[d]||{}).length;
  const deepDays = new Set(Object.values(S.lessons));
  const weekBursts = days.slice(-7).reduce((a,d)=>a+bc(d),0);
  const mastered = Object.values(S.cards).filter(r=>r.b>=4).length;
  const takes = LESSONS.filter(l=>S.notes[l.id]&&S.notes[l.id].take&&S.notes[l.id].take.trim()).slice(-8).reverse();
  const key = apiKey(), model = apiModel();
  return '<button class="back" data-tab="today">Back to today</button><h1>Progress</h1><p class="lede">'+esc(syncLabel)+'.</p>'+
  '<div class="sec stats"><div class="stat"><b>'+streak()+'</b><span>Day streak</span></div><div class="stat"><b>'+Object.keys(S.iv||{}).length+'</b><span>Interview questions practised</span></div>'+
  '<div class="stat"><b>'+doneCount("tech")+'/'+TRACKS.tech.total+'</b><span>Tech line sessions</span></div><div class="stat"><b>'+doneCount("cfo")+'/'+TRACKS.cfo.total+'</b><span>CFO line sessions</span></div>'+
  '<div class="stat"><b>'+weekBursts+'</b><span>Bursts in the last 7 days</span></div><div class="stat"><b>'+mastered+'</b><span>Cards strong or mastered</span></div></div>'+
  '<div class="sec"><h2>Last four weeks</h2><div class="heat">'+days.map(d=>'<i class="'+(deepDays.has(d)?"on":(bc(d)||S.act[d]?"half":""))+'" title="'+d+'"></i>').join("")+'</div><p class="hint">Dark: a focused session. Light: short breaks only.</p></div>'+
  '<div class="sec"><h2>Terms you looked up</h2>'+(S.log.length?'<ul class="log">'+S.log.slice(0,15).map(x=>'<li>'+esc(x.t)+'<small>'+esc(x.d)+'</small></li>').join("")+'</ul>':'<p class="hint">Terms you ask about or capture in the reflection burst appear here.</p>')+'</div>'+
  '<div class="sec"><h2>Your takeaways</h2>'+(takes.length?'<ul class="log">'+takes.map(l=>'<li>'+esc(S.notes[l.id].take).replace(/\n/g,"<br>")+'<small>'+esc(l.t)+'</small></li>').join("")+'</ul>':'<p class="hint">The three lines you write at the end of each session collect here.</p>')+'</div>'+
  '<div class="sec settings"><h2>Settings</h2>'+
   '<p class="hint">Which line should the daily session come from?</p><div class="seg" role="group" aria-label="Mix">'+[["balanced","Alternate"],["tech","Tech first"],["cfo","CFO first"]].map(m=>'<button data-mix="'+m[0]+'" aria-pressed="'+(S.set.mix===m[0])+'">'+m[1]+'</button>').join("")+'</div>'+
   '<label class="hint" for="prof" style="display:block;margin-top:16px">About you, used to tailor Claude\'s coaching. Stays on this device.</label><textarea class="field" id="prof" placeholder="'+esc(DEFAULT_PROFILE)+'">'+esc(S.set.profile||"")+'</textarea>'+
   (STANDALONE? '<h3 style="margin-top:20px">Claude features</h3><p class="hint">Paste an Anthropic API key to switch on coaching, roleplays and the daily briefing. The key is stored only on this phone and sent only to Anthropic.</p>'+
     '<input class="field" id="key" type="password" autocomplete="off" placeholder="sk-ant-…" value="'+esc(key)+'">'+
     '<label class="hint" for="model" style="display:block;margin-top:10px">Model</label><select class="field" id="model">'+MODELS.map(m=>'<option value="'+m[0]+'"'+(m[0]===model?' selected':'')+'>'+esc(m[1])+'</option>').join("")+'</select>'+
     '<div class="btns"><button class="btn primary small" id="keySave">Save key</button><button class="btn ghost small" id="keyTest">Test it</button>'+(key?'<button class="btn ghost small" id="keyDel">Remove key</button>':'')+'</div><div class="out" id="keyOut"></div>'+
     '<h3 style="margin-top:20px">Backup</h3><p class="hint">Your progress lives only on this phone. Export a backup now and then.</p><div class="btns"><button class="btn ghost small" id="exp">Export backup</button><label class="btn ghost small" for="imp">Import backup</label><input type="file" id="imp" accept="application/json,.json" hidden></div>' : '')+
   '<div class="btns" style="margin-top:20px"><button class="btn ghost small" id="resetAll">Reset all progress</button></div></div>';
}

/* ---------- bursts ---------- */
function openBurst(k){
  if(k==="cards") return cardSession();
  if(k==="interview") return interviewSheet();
  if(k==="explain"){
    const pool = unlockedCards(); const c = pool[hash(today()+"x")%pool.length];
    sheet("Explain it in 60 seconds",
     '<p>Your concept:</p><div class="say">'+esc(c.t)+'</div><p>Start a 60-second timer. Explain it out loud as if to a stakeholder or an interviewer: what it is, why it matters, one example. Then dictate or type what you said.</p>'+
     '<textarea class="field" id="exIn" placeholder="What I said"></textarea>'+
     '<div class="btns"><button class="btn ghost small ai-only" id="exFb">Get feedback</button><button class="btn ghost small" id="exPeek">Check the card</button><button class="btn primary small" id="exDone">Mark done</button></div><div class="out" id="exOut"></div>',
     ()=>{
      $("#exPeek").onclick=()=>{ $("#exOut").innerHTML='<h3>'+esc(c.t)+'</h3><p>'+esc(c.d)+'</p><p class="hint">'+esc(c.p||"")+'</p>'; };
      $("#exDone").onclick=()=>{ doneBurst("explain"); closeSheet(); render(); };
      const fb=$("#exFb"); if(fb) fb.onclick=()=>{ const t=$("#exIn").value.trim(); if(t.length<15){toast("Say or type a bit more first");return;}
        askAI(profile()+"\n\nThey explained \""+c.t+"\" out loud in about 60 seconds. Reference meaning: "+c.d+"\nTheir words (from dictation; ignore dictation errors):\n\"\"\"\n"+t.slice(0,3000)+"\n\"\"\"\nHeadings: ### Accurate? (one line) ### What to add or cut ### A sharper version (under 90 words). Under 200 words.", $("#exOut"), {button:fb, cache:false, tier:"quick"}); };
     });
    return;
  }
  if(k==="phrase"){
    const all = PHRASES.flatMap(s=>s.p.map(p=>({s:s.s,p:p}))); const x = all[hash(today()+"p")%all.length];
    sheet("Phrase drill",
     '<p class="hint">'+esc(x.s)+'</p><div class="say">'+esc(x.p)+'</div><p>Say it three times out loud. Then write the version you\'ll actually use this week, with a real project in it.</p>'+
     '<textarea class="field" id="phIn" placeholder="My version"></textarea>'+
     '<div class="btns"><button class="btn ghost small ai-only" id="phPol">Polish my version</button><button class="btn primary small" id="phDone">Mark done</button></div><div class="out" id="phOut"></div>',
     ()=>{
      $("#phDone").onclick=()=>{ doneBurst("phrase"); closeSheet(); render(); };
      const pb=$("#phPol"); if(pb) pb.onclick=()=>{ const t=$("#phIn").value.trim(); if(!t){toast("Write your version first");return;}
        askAI(profile()+"\n\nSituation: "+x.s+". Model phrase: \""+x.p+"\". Their version: \""+t.slice(0,800)+"\". Give two polished alternatives (one more direct, one more diplomatic for high-context APAC audiences) and one sentence on when to use which. Under 120 words.", $("#phOut"), {button:pb, cache:false, tier:"quick"}); };
     });
    return;
  }
  if(k==="pulse"){
    const s = SOURCES[hash(today())%SOURCES.length];
    sheet("Pulse scan",
     (STANDALONE? '<p>Pick one headline that touches IS delivery, cloud, security, AI or corporate finance.</p>'+headlinesHTML(6) : '<p>Open today\'s source, skim for three minutes, and pick one headline that touches IS delivery, cloud, security, AI or corporate finance.</p>')+
     '<div class="btns"><a class="btn signal small" href="'+s.u+'" target="_blank" rel="noopener">Open '+esc(s.n)+'</a></div>'+
     '<p style="margin-top:14px">Paste or tap Decode on a headline:</p><textarea class="field" id="psIn" style="min-height:80px"></textarea>'+
     '<div class="btns"><button class="btn ghost small ai-only" id="psGo">Decode it</button><button class="btn primary small" id="psDone">Mark done</button></div><div class="out" id="psOut"></div>',
     ()=>{
      $("#psDone").onclick=()=>{ doneBurst("pulse"); closeSheet(); render(); };
      const g=$("#psGo"); if(g) g.onclick=()=>decode($("#psOut"), g, $("#psIn").value);
      document.querySelectorAll("#sheetBody [data-dec]").forEach(b=>b.onclick=()=>{ $("#psIn").value=b.dataset.dec; if(aiOn()) decode($("#psOut"), $("#psGo"), b.dataset.dec); });
     });
    return;
  }
  if(k==="reflect"){
    sheet("What did I hear today?",
     '<p>Any term, acronym or idea from today\'s meetings or emails that you didn\'t fully follow? Capture it while it\'s fresh.</p>'+
     '<div class="inline"><input class="field" id="rfIn" placeholder="e.g. egress costs, SoD conflict" autocomplete="off"><button class="btn primary small" id="rfAdd">Save</button></div>'+
     '<div class="out" id="rfOut"></div><div class="btns"><button class="btn ghost small" id="rfDone">Nothing new today, mark done</button></div>',
     ()=>{
      const add=()=>{ const t=$("#rfIn").value.trim(); if(!t) return; S.log.unshift({d:today(),t:t}); S.log=S.log.slice(0,200); doneBurst("reflect"); $("#rfIn").value="";
        if(aiOn()) askAI(profile()+"\n\nExplain \""+t+"\" as used in an enterprise IS or corporate finance context. Headings: ### Plain meaning (2 sentences) ### Why it matters to me (1 sentence) ### A smart question to ask. Under 110 words.", $("#rfOut"), {tier:"quick"});
        else $("#rfOut").innerHTML='<p>Saved. You\'ll find it under Progress.</p>';
      };
      $("#rfAdd").onclick=add; $("#rfIn").addEventListener("keydown",e=>{ if(e.key==="Enter") add(); });
      $("#rfDone").onclick=()=>{ doneBurst("reflect"); closeSheet(); render(); };
     });
  }
}

/* ---------- sheet ---------- */
let lastFocus=null;
function sheet(title, html, after){
  lastFocus = document.activeElement;
  $("#sheetBody").innerHTML = '<div class="shead"><h2 id="sheetTitle">'+esc(title)+'</h2><button class="x" id="sx">Close</button></div><div class="sbody">'+html+'</div>';
  $("#scrim").classList.add("open"); $("#sheet").classList.add("open"); $("#sheet").scrollTop=0;
  $("#sx").onclick = closeSheet;
  if(after) after();
  setTimeout(()=>{ const x=$("#sx"); if(x) x.focus(); }, 50);
}
function closeSheet(){ $("#scrim").classList.remove("open"); $("#sheet").classList.remove("open"); if(lastFocus&&lastFocus.focus) lastFocus.focus(); }
$("#scrim").onclick = closeSheet;
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeSheet(); });

/* ---------- binding ---------- */
function bind(){
  document.querySelectorAll("#view [data-open]").forEach(b=>b.onclick=()=>go("path", b.dataset.open));
  document.querySelectorAll("#view [data-burst]").forEach(b=>b.onclick=()=>openBurst(b.dataset.burst));
  document.querySelectorAll("#view [data-week]").forEach(b=>b.onclick=()=>{ const el=$("#wk"+b.dataset.week); el.hidden=!el.hidden; b.setAttribute("aria-expanded", String(!el.hidden)); });
  document.querySelectorAll("#view [data-dec]").forEach(b=>b.onclick=()=>{ const h=$("#hl"); if(h){ h.value=b.dataset.dec; h.scrollIntoView({block:"center",behavior:"smooth"}); if(aiOn()) decode($("#hlOut"), $("#hlGo"), b.dataset.dec); } });
  const bg=$("#briefGo"); if(bg) bg.onclick=()=>runBrief(bg);
  if(tab==="today"){
    const g=$("#termGo"); if(g) g.onclick=explainTerm;
    $("#termQ").addEventListener("keydown",e=>{ if(e.key==="Enter"&&aiOn()) explainTerm(); });
    const sw=$("#swap"); if(sw) sw.onclick=()=>{ const tr=todayTrack(); S.pick={d:today(), t: tr==="tech"?"cfo":"tech"}; save(); render(); };
  }
  if(tab==="path"){
    if(sub) bindLesson(sub);
    document.querySelectorAll("[data-ptrack]").forEach(b=>b.onclick=()=>{ pathTrack=b.dataset.ptrack; render(); });
  }
  if(tab==="cards"){
    $("#quizBtn").onclick=quizSession;
    $("#cfind").addEventListener("input", e=>{ const q=e.target.value.toLowerCase().trim(); document.querySelectorAll("#gloss details").forEach(d=>{ d.hidden = !!q && !d.dataset.q.includes(q); }); });
    document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{ S.custom=S.custom.filter(c=>c.id!==b.dataset.del); delete S.cards[b.dataset.del]; save(); render(); });
  }
  if(tab==="speak"){
    document.querySelectorAll("[data-seg]").forEach(b=>b.onclick=()=>{ speakSeg=b.dataset.seg; lset("seg",speakSeg); render(); });
    document.querySelectorAll("[data-ivcat]").forEach(b=>b.onclick=()=>{ ivCat=b.dataset.ivcat; render(); });
    document.querySelectorAll("[data-iv]").forEach(b=>b.onclick=()=>interviewSheet(INTERVIEW[+b.dataset.iv]));
    document.querySelectorAll("[data-story]").forEach(b=>b.onclick=()=>storySheet(b.dataset.story));
    const sn=$("#stNew"); if(sn) sn.onclick=()=>storySheet(null);
    document.querySelectorAll("[data-sit]").forEach(b=>b.onclick=()=>{ sitIdx=+b.dataset.sit; render(); });
    document.querySelectorAll("[data-per]").forEach(b=>b.onclick=()=>{ if(chatCtl) chatCtl.abort(); persona=ALLPERSONAS.find(p=>p.id===b.dataset.per); chat=[]; render(); });
    const send=$("#chatSend");
    if(send){
      send.onclick=()=>{ const t=$("#chatIn").value.trim(); if(!t) return; $("#chatIn").value=""; sendChat(t,false); };
      $("#chatDebrief").onclick=()=>{ if(!chat.length){toast("Reply at least once first");return;} sendChat("",true); };
      $("#chatReset").onclick=()=>{ if(chatCtl) chatCtl.abort(); chat=[]; render(); };
    }
  }
  if(tab==="pulse"){
    const g=$("#hlGo"); if(g) g.onclick=()=>decode($("#hlOut"), g, $("#hl").value).then(r=>{ if(r) doneBurst("pulse"); });
    if(STANDALONE && hnState.status==="idle") loadHeadlines(false);
  }
  if(tab==="me"){
    document.querySelectorAll("[data-mix]").forEach(b=>b.onclick=()=>{ S.set.mix=b.dataset.mix; S.pick=null; save(); render(); });
    const pf=$("#prof"); pf.addEventListener("input",()=>{ clearTimeout(pf._t); pf._t=setTimeout(()=>{ S.set.profile=pf.value; save(); },600); });
    const ks=$("#keySave");
    if(ks){
      ks.onclick=()=>{ const v=$("#key").value.trim(); lset("key", v||null); lset("model", $("#model").value); refreshAI(); toast(v?"Key saved on this phone":"Key removed"); render(); };
      $("#model").onchange=()=>{ lset("model", $("#model").value); toast("Model saved"); };
      $("#keyTest").onclick=()=>{ const v=$("#key").value.trim(); if(v) lset("key",v); lset("model",$("#model").value); refreshAI(); askAI("Reply with exactly: Connected. Ready to coach.", $("#keyOut"), {button:$("#keyTest"), max:30}); };
      const kd=$("#keyDel"); if(kd) kd.onclick=()=>{ lset("key",null); lset("brief",null); refreshAI(); toast("Key removed"); render(); };
      $("#exp").onclick=()=>{ const blob=new Blob([JSON.stringify(S,null,1)],{type:"application/json"}); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="fluency-line-backup-"+today()+".json"; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},1000); };
      $("#imp").onchange=e=>{ const f=e.target.files[0]; if(!f) return; f.text().then(t=>{ const d=JSON.parse(t); if(!d||typeof d!=="object"||!d.lessons) throw 0; if(confirm("Replace this phone's progress with the backup?")){ S=Object.assign(blank(), d); S.set=Object.assign({mix:"balanced",profile:""},S.set||{}); save(); render(); toast("Backup restored"); } }).catch(()=>toast("That file isn't a Fluency Line backup")); };
    }
    $("#resetAll").onclick=()=>{ if(confirm("Reset all sessions, cards, stories and notes? This can't be undone.")){ S=blank(); save(); render(); } };
  }
}

/* ---------- PWA ---------- */
if(STANDALONE){
  try{
    const l=document.createElement("link"); l.rel="manifest"; l.href="manifest.webmanifest"; document.head.appendChild(l);
    if("serviceWorker" in navigator && location.protocol==="https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
  }catch(e){}
  loadHeadlines(false);
}

render();
initAI();
initRemote();
})();
