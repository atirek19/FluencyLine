<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#0F4C47">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fluency Line</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F6F2; --surface:#FFFFFF; --ink:#15302D; --muted:#5A6F6A; --line:#D3DFD9;
  --pine:#0F4C47; --on-pine:#FFFFFF; --gold:#A87700; --signal:#F2B705; --on-signal:#1C1A10; --sea:#DFEDE7; --bad:#A8322A;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --nav:64px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1615; --surface:#122220; --ink:#E3EEEA; --muted:#93A8A2; --line:#22403B;
    --pine:#6BC0B2; --on-pine:#08201D; --gold:#E2B33C; --signal:#F5C842; --on-signal:#1C1A10; --sea:#173430; --bad:#F08A80;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1615; --surface:#122220; --ink:#E3EEEA; --muted:#93A8A2; --line:#22403B;
  --pine:#6BC0B2; --on-pine:#08201D; --gold:#E2B33C; --signal:#F5C842; --on-signal:#1C1A10; --sea:#173430; --bad:#F08A80;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none !important}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;padding-bottom:calc(var(--nav) + 16px)}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;letter-spacing:-0.01em}
h1{font-size:1.75rem;font-weight:800}
h2{font-size:1.3rem;font-weight:700}
h3{font-size:1.05rem;font-weight:700}
p{margin:0 0 .6em}
a{color:var(--pine)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--signal);outline-offset:2px;border-radius:6px}
.wrap{max-width:640px;margin:0 auto;padding:0 18px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:12px;padding-bottom:12px}
.brand{font-family:var(--display);font-weight:800;font-size:1.1rem;display:flex;align-items:center;gap:8px}
.brand i{width:14px;height:14px;border-radius:50%;background:var(--signal);box-shadow:0 0 0 3px var(--pine);display:inline-block}
.streak{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.9rem;display:flex;gap:6px;align-items:center}
.streak b{font-family:var(--display)}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .row{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav)}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.75rem;color:var(--muted)}
.nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="page"]{color:var(--pine);font-weight:700}

main{padding-top:18px}
.lede{color:var(--muted);margin-top:4px}
.sec{margin:26px 0}
.sec > h2{margin-bottom:10px}

/* deep session hero */
.deep{background:var(--pine);color:var(--on-pine);border-radius:18px;padding:20px;position:relative;overflow:hidden}
.deep .meta{font-size:.9rem;opacity:.85}
.deep h1{margin:6px 0 10px;font-size:1.6rem}
.deep .track{display:flex;gap:4px;margin:14px 0 16px}
.deep .track span{flex:1;height:6px;border-radius:3px;background:color-mix(in srgb,var(--on-pine) 25%,transparent)}
.deep .track span.on{background:var(--signal)}
.btn{text-decoration:none;display:inline-flex;text-align:center;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:12px 16px;font-weight:700;min-height:46px}
.btn.primary{background:var(--pine);color:var(--on-pine)}
.btn.signal{background:var(--signal);color:var(--on-signal)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.small{min-height:38px;padding:8px 12px;font-size:.92rem;border-radius:10px}
.btn:disabled{opacity:.5;cursor:default}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}

/* bursts */
.bursts{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.bursts li{border-bottom:1px solid var(--line)}
.bursts button{width:100%;background:none;border:0;text-align:left;display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:center;padding:14px 2px}
.tick{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
.done .tick{background:var(--pine);border-color:var(--pine)}
.done .tick::after{content:"";width:9px;height:5px;border-left:2px solid var(--on-pine);border-bottom:2px solid var(--on-pine);transform:rotate(-45deg) translate(1px,-1px)}
.bursts .bt{font-weight:700}
.bursts .bd{font-size:.9rem;color:var(--muted)}
.bursts .min{font-size:.85rem;color:var(--muted)}
.meter{display:flex;justify-content:space-between;font-size:.9rem;color:var(--muted);margin-top:8px}

/* ask box */
.ask{background:var(--sea);border-radius:16px;padding:16px}
.ask label{font-weight:700;display:block;margin-bottom:8px}
.field{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
textarea.field{min-height:110px;resize:vertical}
.inline{display:flex;gap:8px}
.inline .field{flex:1}
.out{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:.98rem}
.out:empty{display:none}
.out h3{margin:12px 0 4px;font-size:1rem}
.out h3:first-child{margin-top:0}
.out ul{margin:4px 0 8px;padding-left:20px}
.out .thinking{color:var(--muted)}
body:not(.ai) .ai-only{display:none !important}
body.ai .ai-off{display:none !important}
.hint{font-size:.88rem;color:var(--muted);margin-top:6px}

/* path: transit line */
.line{position:relative;margin:8px 0 0;padding:0;list-style:none}
.line::before{content:"";position:absolute;left:15px;top:14px;bottom:14px;width:6px;border-radius:3px;background:var(--pine)}
.stn{position:relative;padding-left:48px;margin-bottom:6px}
.stn > button{width:100%;text-align:left;background:none;border:0;padding:10px 0;display:block}
.dot{position:absolute;left:6px;top:12px;width:24px;height:24px;border-radius:50%;background:var(--surface);border:5px solid var(--pine)}
.stn.complete .dot{background:var(--pine)}
.stn.current .dot{background:var(--signal);border-color:var(--pine);transform:scale(1.18)}
.stn .wk{font-size:.85rem;color:var(--muted)}
.stn .nm{font-family:var(--display);font-weight:700;font-size:1.12rem}
.stn .sb{font-size:.92rem;color:var(--muted)}
.stn .bar{height:4px;background:var(--line);border-radius:2px;margin-top:6px;max-width:220px}
.stn .bar span{display:block;height:100%;background:var(--pine);border-radius:2px}
.days{list-style:none;padding:0;margin:4px 0 14px}
.days button{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:6px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.days .ok{color:var(--pine);font-weight:700;font-size:.85rem;white-space:nowrap}

/* lesson */
.phase{border-left:4px solid var(--line);padding:4px 0 4px 14px;margin:22px 0}
.phase.live{border-color:var(--signal)}
.phase .ph{font-size:.88rem;color:var(--muted);margin-bottom:2px}
.phase ul{padding-left:20px;margin:8px 0}
.phase li{margin-bottom:6px}
.say{font-family:var(--display);font-size:1.15rem;font-weight:500;line-height:1.35;background:var(--sea);border-radius:14px;padding:14px 16px;margin:8px 0}
.timer{position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);z-index:4;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.timer .clock{font-family:var(--display);font-weight:800;font-size:1.3rem;font-variant-numeric:tabular-nums}
.timer .pl{font-size:.9rem;color:var(--muted)}
.back{background:none;border:0;color:var(--pine);font-weight:700;padding:6px 0;margin-bottom:6px}

/* cards */
.flash{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;min-height:220px;display:flex;flex-direction:column;justify-content:center}
.flash .term{font-family:var(--display);font-weight:800;font-size:1.6rem}
.flash .def{margin-top:12px}
.flash .pmo{margin-top:10px;color:var(--muted);font-size:.95rem}
.count{font-size:.9rem;color:var(--muted);margin-bottom:8px}
.boxes{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
.boxes div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}
.boxes b{display:block;font-family:var(--display);font-size:1.2rem}
.boxes span{font-size:.75rem;color:var(--muted)}
.glossary details{border-bottom:1px solid var(--line);padding:10px 0}
.glossary summary{font-weight:700;cursor:pointer}
.glossary p{margin:6px 0 0}
.opt{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
.opt.right{border-color:var(--pine);background:var(--sea)}
.opt.wrong{border-color:var(--bad)}

/* speak */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:.92rem}
.chip[aria-pressed="true"]{background:var(--pine);color:var(--on-pine);border-color:var(--pine)}
.phr{list-style:none;padding:0;margin:10px 0 0}
.phr li{padding:12px 0;border-bottom:1px solid var(--line);font-family:var(--display);font-size:1.05rem;font-weight:500}
.chat{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.msg{max-width:88%;padding:10px 14px;border-radius:16px;white-space:pre-wrap}
.msg.them{background:var(--surface);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}
.msg.me{background:var(--pine);color:var(--on-pine);align-self:flex-end;border-bottom-right-radius:4px}
.msg .who{display:block;font-size:.78rem;opacity:.75;margin-bottom:2px}

/* pulse */
.src{list-style:none;padding:0;margin:0}
.src li{border-bottom:1px solid var(--line)}
.src a{display:flex;justify-content:space-between;gap:10px;padding:12px 0;text-decoration:none;color:var(--ink)}
.src a b{display:block}
.src a span{font-size:.9rem;color:var(--muted)}
.src .go{color:var(--pine);font-weight:700;align-self:center}

/* stats */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.stat b{font-family:var(--display);font-size:1.7rem;display:block;line-height:1.1}
.stat span{font-size:.88rem;color:var(--muted)}
.heat{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;margin-top:10px}
.heat i{aspect-ratio:1;border-radius:4px;background:var(--line)}
.heat i.on{background:var(--pine)}
.heat i.half{background:color-mix(in srgb,var(--pine) 45%,var(--line))}
.log{list-style:none;padding:0;margin:0}
.log li{border-bottom:1px solid var(--line);padding:10px 0}
.log small{color:var(--muted);display:block}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(5,15,14,.45);z-index:20;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--bg);border-radius:20px 20px 0 0;max-height:92%;overflow:auto;transform:translateY(105%);visibility:hidden;transition:transform .25s ease,visibility 0s linear .25s;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 18px)}
.sheet.open{transform:none;visibility:visible;transition:transform .25s ease}
.scrim.open{display:block}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:10px auto 6px}
.sheet .wrap{padding-top:6px}
.sheet .shead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.x{background:none;border:1px solid var(--line);border-radius:10px;padding:6px 10px}
@media (prefers-reduced-motion: reduce){.sheet{transition:none}}
.toast{position:fixed;left:50%;bottom:calc(var(--nav) + env(safe-area-inset-bottom,0px) + 14px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:.92rem;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}

/* v2 additions */
.btn.onpine{background:transparent;color:var(--on-pine);border:1px solid color-mix(in srgb,var(--on-pine) 45%,transparent)}
.seg{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;margin:14px 0}
.seg button{flex:1;border:0;background:none;border-radius:10px;padding:9px 6px;font-weight:700;font-size:.92rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--pine);color:var(--on-pine)}
.seg small{font-weight:400;opacity:.8}
.line.gold::before{background:var(--gold)}
.line.gold .dot{border-color:var(--gold)}
.line.gold .stn.complete .dot{background:var(--gold)}
.line.gold .stn.current .dot{border-color:var(--gold)}
.line.gold .stn .bar span{background:var(--gold)}
.mix{display:grid;gap:10px}
.mi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.ml{font-size:.85rem;color:var(--muted)}
.mq{font-family:var(--display);font-weight:700;font-size:1.12rem;margin:4px 0 8px;line-height:1.3}
.qlist{list-style:none;padding:0;margin:12px 0 0}
.qlist button{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:6px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.qlist small{color:var(--muted)}
.ok{color:var(--pine);font-weight:700;font-size:.85rem;white-space:nowrap}
.chips.cwrap{flex-wrap:wrap;overflow:visible}
.phr.plain li{font-family:var(--body);font-weight:400;font-size:1rem}
.chk{margin:12px 0;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface)}
.chk summary{font-weight:700;cursor:pointer}
.chk label{display:flex;gap:8px;align-items:flex-start;margin-top:8px}
.chk input{width:20px;height:20px;accent-color:var(--pine);flex:none;margin-top:2px}
select.field{appearance:auto}
.src li.hl{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 0}
.src li.hl a{display:block;padding:0}
.src li.hl a span{display:block}
.timer .btn{white-space:nowrap}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand"><i aria-hidden="true"></i>Fluency Line</div>
  <button class="streak" id="streakBtn" aria-label="Open progress"><b id="streakN">0</b> day streak</button>
</div></header>
<main class="wrap" id="view" tabindex="-1"></main>
<nav class="nav" aria-label="Sections"><div class="row" id="nav"></div></nav>
<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><div class="grab"></div><div class="wrap" id="sheetBody"></div></section>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const WEEKS = [
{t:"Map the IS world", s:"What an IS team actually does, and where you sit in it", days:[
 {t:"Run vs change", k:["IS work splits into run (keeping apps and services alive: support, incidents, patches, licences) and change (projects that build, upgrade or retire things).","In most enterprises run consumes the larger share of the IS budget, so every new project's ongoing run cost matters as much as its build cost.","The application portfolio is the inventory of every app: business owner, users, cost, technology, support model and lifecycle status.","Support is tiered: L1 service desk logs and triages, L2 application support diagnoses, L3 developers or vendors fix the code."], ex:"List the 10 most important applications your APAC team supports. For each, note the business owner, who supports it (L2/L3, internal or vendor) and whether it has change work planned. Every blank cell is a question for this week.", say:"Most of our capacity keeps the lights on. My job is to make sure change work lands without destabilising what's already running."},
 {t:"The software lifecycle on one page", k:["SDLC stages: requirements, design, build, test, deploy, operate. Agile teams loop through these every sprint; waterfall does them once in sequence.","Code is promoted through environments: Dev, Test/QA, UAT, Staging (pre-prod), Production. Each step adds confidence.","Testing types you'll hear: unit, integration, regression, performance, security, and UAT where the business signs off.","Definition of Done is the team's quality bar for a work item; go-live criteria are the business and operational bar for a release."], ex:"Pick one recent deployment. Trace which environments it passed through and who signed off at each stage. Where did it wait the longest, and why?", say:"Has this passed UAT with business sign-off, and what's our rollback plan if production behaves differently from staging?"},
 {t:"Architecture vocabulary without the engineering", k:["Most apps have a front end (what users see), a back end (business logic) and a database (where data lives).","An API is a contract that lets one system ask another for data or actions. When an API changes, everything that calls it can break.","Monolith: one big deployable application. Microservices: many small services deployed independently. More flexibility, more moving parts.","Technical debt is the future cost of shortcuts taken today: old libraries, missing tests, quick fixes that became permanent."], ex:"Ask a tech lead to sketch, in five minutes, how one key app connects to others. Redraw it yourself as boxes and arrows and circle anything that would stop several systems if it failed.", say:"If this API changes, which downstream systems are affected and who owns them?"},
 {t:"Who's who in an IS organisation", k:["CIO/CTO set direction; Heads of Applications, Infrastructure and Security (CISO) run the main towers.","Enterprise architects shape the long-term landscape; solution architects design a specific project's solution.","Product Owners own what gets built and in what order; Scrum Masters and delivery leads own how the team works; Business Analysts translate needs into requirements.","Service Delivery, Release and Vendor Managers keep operations, deployments and suppliers on track. The PMO is the connective tissue: governance, visibility, cadence and dependencies."], ex:"Place your top 15 stakeholders on a power/interest grid. Next to each, write the one metric they are judged on. Your reporting should speak to those metrics.", say:"What does a good quarter look like for you? I'd like our portfolio reporting to reflect it."},
 {case:true, t:"Case: the first portfolio review", k:["The regional IS head asks you to present the state of the APAC portfolio in two weeks.","You have a spreadsheet of 40 projects. Status fields are inconsistent: some RAG, some percentages, some blank. Two countries report differently from the rest."], ex:"Answer three questions. Which five data fields do you standardise first, and why? Who do you interview first, and what three questions do you ask them? How do you present uncertainty honestly without looking unprepared?", say:"Here's what we know with confidence, here's what we're still validating, and here's the date it will be clean."}
]},
{t:"Delivery methods", s:"Waterfall, agile, flow and scaling, and what each means for a PMO", days:[
 {t:"Waterfall vs agile: when each fits", k:["Waterfall: fixed scope, sequential phases, heavy upfront planning. Fits regulated, infrastructure or hardware-dependent work.","Agile: value delivered in small increments, with time and cost fixed and scope flexing.","Most enterprises run hybrids, often agile build inside waterfall governance ('water-scrum-fall').","The iron triangle still applies: scope, time and cost can't all be fixed. Agile simply chooses which one flexes."], ex:"Classify five of your projects by the method they claim to use and the method they actually use. Where they differ, note what that does to reporting.", say:"In agile we fix time and cost and let scope flex, so the real question is which features drop if we hold the date."},
 {t:"Scrum mechanics", k:["Roles: Product Owner (what and why), Scrum Master (process and blockers), Developers (how).","Events: sprint planning, daily scrum, sprint review (demo to stakeholders), retrospective (improve the process).","Story points estimate relative effort. Velocity is points completed per sprint. It is team-specific and should never be compared across teams.","Burndown shows remaining work in a sprint; carry-over (unfinished work rolled forward) is often the most honest signal of trouble."], ex:"Attend one sprint review this week. Note what was demoed, what carried over, and the reasons given. Compare with the last two sprints.", say:"Velocity is stable, but carry-over has grown three sprints running. What's blocking the team?"},
 {t:"Kanban and flow", k:["Kanban visualises work on a board and limits work in progress (WIP).","Lead time: request to delivery, as the customer feels it. Cycle time: work started to delivered. Throughput: items finished per week.","Little's Law in plain words: more work in progress means longer waits for everything.","Kanban suits support and BAU teams where work arrives unpredictably; a cumulative flow diagram shows where work piles up."], ex:"For your support or enhancement team, estimate average lead time for a change request and current WIP. What would happen if WIP were halved?", say:"We may not need more people yet. We need fewer things in progress at once."},
 {t:"Scaling agile: SAFe and friends", k:["SAFe organises teams into Agile Release Trains that plan together every Program Increment (PI), typically 8 to 12 weeks.","Key roles: Release Train Engineer (chief Scrum Master of the train), Product Management, Business Owners. Work flows as epics, features and stories.","Alternatives include LeSS and Scrum@Scale. The 'Spotify model' (squads, tribes) is often copied without the culture that made it work.","At scale, the PMO's job shifts from tracking tasks to managing flow, dependencies and funding for value streams (Lean Portfolio Management)."], ex:"Draw next quarter's dependency map for your teams: who must deliver something to whom, by when? Mark the three riskiest handoffs.", say:"Let's surface cross-team dependencies at planning, not in week six."},
 {case:true, t:"Case: ninety per cent complete", k:["A vendor team has reported '90% complete' on a fixed-scope project for six weeks running.","Meanwhile the business wants to change requirements mid-way, agile-style, without reopening the contract."], ex:"What evidence would you ask for instead of percentage complete? How do you handle change requests under a fixed-price contract? What do you tell the steering committee this week?", say:"Instead of percent complete, can we see working software and the list of what's left, item by item?"}
]},
{t:"Service management and ITIL 4", s:"How IS keeps services healthy and how that's measured", days:[
 {t:"Incident, problem, change, request", k:["Incident: an unplanned interruption or degradation. Goal: restore service fast.","Problem: the underlying cause of one or more incidents. Goal: root cause analysis and a permanent fix; a known error has a documented workaround.","Change: a controlled modification to a service, classed as standard (pre-approved), normal (assessed) or emergency.","Service request: a routine ask such as access, software or a laptop, fulfilled through a catalogue."], ex:"Pull last month's top incident categories from your ITSM tool. Which clusters look like one underlying problem that nobody has opened a problem record for?", say:"We've closed these incidents, but is there a problem record open for the root cause?"},
 {t:"SLAs, OLAs and watermelons", k:["SLA: commitment to the customer, such as restoring a P1 within four hours. OLA: internal team commitments that make the SLA possible. Underpinning contracts cover vendors.","Priority usually equals impact multiplied by urgency, mapped to P1 to P4.","Watermelon metrics are green outside and red inside: SLAs met while users are unhappy.","Experience level agreements (XLAs) add user-perceived measures such as satisfaction and lost productivity."], ex:"Find one SLA your team reports as green that users still complain about. What is the SLA measuring, and what is it missing?", say:"Our SLA is green but the experience isn't. I'd like to add a user-side measure next to it."},
 {t:"Change enablement and the CAB", k:["The Change Advisory Board reviews risky changes; the change calendar shows what is going live when.","Change freezes protect business peaks such as month-end close, audits and major holidays.","Standard changes are low-risk, repeatable and pre-approved, so they skip the CAB.","ITIL 4 renamed change management to change enablement: the aim is speed with safety, increasingly through automated checks in pipelines rather than meetings."], ex:"Look at next month's change calendar across APAC. Spot clashes with business peaks and local public holidays in each country.", say:"This change happens every month without incident. Can we make it a standard change so it doesn't need CAB each time?"},
 {t:"ITIL 4 big picture and tools", k:["ITIL 4 frames IT as a service value system made of value streams and practices, not a set of rigid processes.","Seven guiding principles: focus on value; start where you are; progress iteratively with feedback; collaborate and promote visibility; think and work holistically; keep it simple and practical; optimise and automate.","Major incidents get a dedicated manager, a communication cadence and a blameless post-incident review.","Common ITSM tools: ServiceNow, Jira Service Management, BMC Helix, Freshservice."], ex:"Which guiding principle is your team weakest at? Write one concrete change you could sponsor this month.", say:"Let's run a blameless review. The goal is to fix the system, not find a person."},
 {case:true, t:"Case: P1 at 9am Singapore", k:["The main customer-facing application goes down at 9am Singapore time.","Sydney is heading into the afternoon, India is just logging in, and the vendor's L3 team is in another time zone."], ex:"Who leads the incident and who communicates? What goes in the first stakeholder message, and how often do you update? What do you insist on once service is restored?", say:"Next update in 30 minutes, even if the update is that we're still investigating."}
]},
{t:"Cloud and infrastructure", s:"Enough cloud fluency to follow any architecture or outage conversation", days:[
 {t:"IaaS, PaaS, SaaS and shared responsibility", k:["IaaS: you rent virtual machines and manage everything above them. PaaS: the provider runs the platform, you bring code. SaaS: you use the finished application.","Main providers: Microsoft Azure, AWS and Google Cloud, plus SaaS platforms such as Microsoft 365, Salesforce and ServiceNow.","Shared responsibility: the provider secures the cloud; you secure what you put in it (data, identities, configuration).","Moving up the stack means less control and less effort: you swap operations work for vendor and configuration management."], ex:"Classify 10 of your applications as on-premises, IaaS, PaaS or SaaS. Which ones cause the most support effort, and does the hosting model explain it?", say:"Moving to SaaS shifts us from running software to managing a vendor and its configuration."},
 {t:"Regions, resilience and recovery", k:["Cloud regions are geographic locations; availability zones are separate data centres within a region. APAC regions include Singapore, Sydney, Tokyo, Mumbai and others.","High availability keeps a service running through component failures. Disaster recovery restores it after a major event.","RTO (recovery time objective): how quickly service must be back. RPO (recovery point objective): how much data loss is acceptable, measured in time.","Untested DR plans are assumptions, not capabilities."], ex:"For your top three applications, find the documented RTO and RPO and the date DR was last tested. Note any that are missing.", say:"What's the RTO and RPO for this, and when did we last test a failover?"},
 {t:"Cloud migration: the Rs", k:["Rehost (lift and shift), Replatform (small optimisations), Refactor (re-architect), Repurchase (move to SaaS), Retire, Retain, Relocate.","A landing zone is the pre-built, governed cloud foundation (accounts, network, security, policies) that applications move into.","Migrations run in waves, grouping applications that depend on each other.","Classic cost surprises: data egress charges, idle resources left running, and lifting inefficient systems without optimising them."], ex:"Pick five legacy applications and propose an R for each, with a one-line reason. Which one would you challenge the business to retire?", say:"Before we lift and shift this, are we sure it shouldn't simply be retired?"},
 {t:"Identity, networks and end-user basics", k:["Identity is the new perimeter: single sign-on (SSO), Microsoft Entra ID (formerly Azure AD) or Okta, multi-factor authentication, role-based access.","Joiner-mover-leaver processes decide how fast people get, change and lose access.","Network words you'll hear in outages: VPN, SD-WAN, firewall, DNS, latency.","End-user computing covers laptops, Microsoft 365 and device management such as Intune."], ex:"Find out how long a new joiner in one APAC country waits to get full application access. Map the steps and the handoffs.", say:"Is this an access issue, a network issue or the application itself? Let's isolate it before we escalate."},
 {case:true, t:"Case: one app, eight countries, one regulator", k:["The business wants to move an on-premises application used in eight APAC countries to the cloud.","One country's regulator requires certain data to be stored locally. The vendor's preferred cloud region is Singapore."], ex:"What do you ask architecture and legal? Lay out at least three options (for example a local deployment, data partitioning, keeping one country on-premises) and how you'd present the trade-offs on one slide.", say:"Here are three options, what each costs, and what each means for compliance and support."}
]},
{t:"DevOps and release", s:"How code gets from a developer's laptop to production safely", days:[
 {t:"CI/CD explained", k:["Version control (Git) tracks every change; developers work in branches and propose changes through pull requests that others review.","Continuous integration: every change is automatically built and tested.","Continuous delivery: every change is ready to deploy, with a human approval. Continuous deployment: changes go to production automatically.","Pipelines run in tools such as GitHub Actions, Azure DevOps, GitLab or Jenkins."], ex:"Ask a developer to walk you through one pipeline run. Note each stage, how long it takes, and which steps are still manual.", say:"Which step in the pipeline is still manual, and what would it take to automate it?"},
 {t:"DORA metrics", k:["Four research-backed measures of delivery performance: deployment frequency, lead time for changes, change failure rate, and time to restore service.","High performers deploy often, with short lead times, few failures and fast recovery. Speed and stability improve together.","Use them to help a team improve over time, not to rank teams against each other.","They are far better signals than hours logged or lines of code."], ex:"Estimate the four DORA metrics for one team, even roughly. Which is weakest, and what would move it?", say:"I'd rather track lead time and change failure rate than hours logged."},
 {t:"Release strategies", k:["Big bang releases everything at once; phased rollouts go country by country or user group by user group.","Blue-green runs two identical environments and switches traffic; canary releases to a small percentage first; feature flags switch functionality on and off without redeploying.","Rollback reverts to the previous version; roll-forward fixes and redeploys.","A go/no-go meeting checks readiness; hypercare is the period of heightened support after go-live."], ex:"Draft a ten-item go/no-go checklist for your next release, covering testing, data, support readiness, communications and rollback.", say:"Can we release behind a feature flag to one country first, then expand?"},
 {t:"Quality, technical debt and observability", k:["The test automation pyramid: many fast unit tests, fewer integration tests, few slow end-to-end tests.","Technical debt grows quietly; many teams reserve a fixed share of each sprint to pay it down.","Code quality tools such as SonarQube flag risky code and security issues.","Observability means understanding a system from its logs, metrics and traces, using tools such as Datadog, Dynatrace or Azure Monitor."], ex:"Ask two tech leads which technical debt worries them most. Turn each answer into a risk entry with business impact and an owner.", say:"If we don't pay this debt down, what's the business risk in twelve months?"},
 {case:true, t:"Case: one release in three fails", k:["A third of releases in the last quarter needed a rollback or an urgent fix.","Developers blame slow testing; testers blame late code drops; the business has stopped trusting go-live dates."], ex:"What data do you collect first? Which three interventions would you propose? How would you show improvement over the next quarter?", say:"Let's agree on the data first, then the fix. Here's what the last twelve releases tell us."}
]},
{t:"Enterprise apps and integration", s:"ERP, CRM, integrations, data migration and the app estate", days:[
 {t:"ERP and CRM fundamentals", k:["ERP runs finance, procurement and supply chain: SAP S/4HANA, Oracle Fusion, Microsoft Dynamics 365.","CRM runs sales and customer service: Salesforce, Dynamics 365 Customer Engagement.","SAP's mainstream maintenance for ECC ends in 2027, which is driving many S/4HANA programmes.","Fit-to-standard and 'clean core' mean adopting standard processes and keeping customisation outside the core, so upgrades stay cheap."], ex:"Identify the system of record for customer, employee, supplier and finance data in your organisation. Note any data that has two competing sources.", say:"Are we configuring the standard process or customising it, and who carries the upgrade cost later?"},
 {t:"APIs and integration", k:["Most modern integrations use REST APIs exchanging JSON; webhooks push notifications when something changes.","Point-to-point integrations multiply fast; middleware and iPaaS (MuleSoft, Boomi, Azure Integration Services) centralise them.","Batch integrations move data on a schedule; real-time and event-driven ones (Kafka, event grids) move it as it happens.","Integration testing is where projects slip most often, usually waiting on another team's test environment or data."], ex:"For one active project, list every integration and its status: designed, built, tested end to end. Mark which depend on another team.", say:"Do we have test data and access to the other system's test environment, or is that our critical path?"},
 {t:"Master data and data migration", k:["Master data is the core shared data: customers, suppliers, materials, employees, chart of accounts.","Data migration runs in cycles of mock loads with reconciliation each time, improving quality before the real cutover.","Cleansing and ownership decisions take longer than the technical load itself.","A cutover plan is an hour-by-hour runbook from freeze to go-live, with go/no-go points and a rollback route."], ex:"Draft a cutover plan skeleton running from T-30 days to T+5 days: freezes, mock loads, sign-offs, communications, hypercare.", say:"How many mock migrations have we run, and what did the last reconciliation show?"},
 {t:"Low-code, SaaS sprawl and rationalisation", k:["Low-code platforms such as Power Platform let business users build apps quickly; without governance this becomes shadow IT.","SaaS sprawl means duplicate tools, unused licences and data scattered across vendors.","Gartner's TIME model sorts applications into Tolerate, Invest, Migrate or Eliminate.","Application rationalisation frees budget and reduces risk, but needs business owners to agree to give things up."], ex:"Apply TIME to ten applications in your region. Which two are the strongest candidates to eliminate, and who would need to agree?", say:"Three apps do roughly the same job across APAC. That's a rationalisation opportunity worth a business case."}
 ,{case:true, t:"Case: a country wants its own CRM", k:["A country business head wants a local CRM because the global platform is 'too slow to change'.","They have budget and a vendor ready to start next month."], ex:"What are the arguments for and against? What questions do you ask first? What governance mechanism (for example an architecture review board) should decide, and what compromise could you offer?", say:"Let's fix the speed problem rather than create a second platform. Here's what a faster change lane could look like."}
]},
{t:"Data and analytics", s:"Where numbers come from, who owns them, and the road to AI", days:[
 {t:"Data architecture vocabulary", k:["Transactional systems (OLTP) run the business; analytical systems (OLAP) report on it.","Data warehouse: structured, modelled data for reporting. Data lake: raw data of any kind. Lakehouse: both in one platform.","ETL transforms data before loading; ELT loads first and transforms in the platform.","Common platforms: Microsoft Fabric, Snowflake, Databricks, Google BigQuery; BI tools: Power BI, Tableau."], ex:"Trace one KPI on a leadership dashboard from source system through pipeline and data model to the report. Note how fresh it is.", say:"Which system is the source of truth for this number, and how fresh is it?"},
 {t:"Data governance and quality", k:["A data owner is accountable for a data domain; a data steward manages its definitions and quality day to day.","A data catalogue lists what data exists; lineage shows where it came from and how it changed.","Quality dimensions: accuracy, completeness, timeliness, consistency, validity, uniqueness.","Data classification (public, internal, confidential, restricted) drives security and AI usage rules."], ex:"Pick a report people distrust. Which quality dimension is failing, and who owns fixing it?", say:"Before we build the dashboard, who owns the definition of this metric?"},
 {t:"PMO reporting people actually use", k:["Build one portfolio dataset, fed automatically from Jira, Azure DevOps or ServiceNow, instead of chasing spreadsheets.","Leading indicators predict (scope growth, carry-over, open risks); lagging indicators confirm (milestones missed, budget variance).","RAG must have written criteria, so amber means the same thing in every country.","Trends beat snapshots; one page for executives beats ten."], ex:"Redesign your portfolio status view: at most five fields per project, a trend arrow and one decision needed.", say:"I'd like RAG to be rule-based, so amber means the same thing in Sydney as in Singapore."},
 {t:"Analytics maturity and the path to AI", k:["Maturity runs descriptive (what happened), diagnostic (why), predictive (what will happen), prescriptive (what to do).","Machine learning models learn patterns from historical data; they are only as good as that data.","MLOps applies DevOps discipline to models: versioning, monitoring and retraining.","In most enterprises, data quality is the real bottleneck for AI, not the algorithms."], ex:"Identify one predictive use case for your PMO, such as forecasting project slippage. List the data it would need and whether you have it.", say:"AI won't fix this until the underlying data is consistent."},
 {case:true, t:"Case: two numbers, one meeting", k:["The APAC leadership dashboard shows a different IS cost figure from Finance's report.","The CFO noticed in a meeting and asked which one is right."], ex:"How do you diagnose the gap? Who do you involve? What do you put in place so it doesn't happen again?", say:"Both numbers are right for different definitions. Here's the reconciliation, and here's the one definition I propose we use."}
]},
{t:"Security and compliance", s:"Security language, audits and APAC data rules", days:[
 {t:"Security fundamentals", k:["The CIA triad: confidentiality, integrity, availability.","Common threats: phishing, ransomware, stolen credentials, and supply-chain attacks through vendors and software libraries.","Vulnerability (a weakness), threat (who might exploit it), risk (likelihood times impact). CVEs identify known vulnerabilities; CVSS scores their severity.","Patch SLAs set how quickly critical vulnerabilities must be fixed, often days, not months."], ex:"Find your organisation's patch SLA for critical vulnerabilities and how your applications are performing against it.", say:"What's our exposure if this critical patch waits until the next release window?"},
 {t:"Identity and zero trust", k:["Least privilege: people get only the access they need, for as long as they need it.","Privileged access management (PAM) controls and records administrator access.","Zero trust: never trust, always verify, regardless of network location.","Segregation of duties stops one person controlling a full process end to end, which is critical in ERP and finance systems."], ex:"When was the last access review for one key application? Ask how many orphaned or excessive accounts it found.", say:"Who has admin access to this, and when did we last review it?"},
 {t:"Standards and audits", k:["ISO/IEC 27001 certifies an information security management system. SOC 2 reports on a service provider's controls; Type II tests them over a period.","NIST CSF 2.0 and CIS Controls are widely used frameworks for organising security work.","IT general controls (ITGCs) over access, change and operations are tested in financial audits.","Third-party risk management assesses vendors before and during contracts."], ex:"List the certifications your top five vendors hold. Which ones lack evidence, and when are their reviews due?", say:"Has security reviewed this vendor, and do we have their SOC 2 Type II report?"},
 {t:"APAC privacy and data laws", k:["Key laws: India's DPDP Act 2023 (with implementing rules phasing in), Singapore's PDPA, Australia's Privacy Act and Notifiable Data Breaches scheme, China's PIPL, Japan's APPI, Korea's PIPA. GDPR applies when EU personal data is involved.","Common themes: lawful basis or consent, purpose limitation, breach notification deadlines, and conditions on cross-border transfers.","Some regimes add data localisation for certain data types or sectors.","These rules change often. Your job is to ask the right question early and route it to privacy and legal, not to interpret the law yourself."], ex:"For one application that processes personal data in three or more APAC countries, find where the data is stored and whether it crosses borders.", say:"Has privacy reviewed the cross-border flow for this data under each country's rules?"},
 {case:true, t:"Case: the vendor's bad news", k:["A key vendor emails to say they've had a security incident that may have involved your data.","Details are vague and the email arrived on a Friday evening."], ex:"What do you do in the first 24 hours? Who do you notify internally? What do you check in the contract? How do you communicate with the business without causing panic?", say:"We've been notified, security and legal are engaged, and we'll confirm impact by a specific time."}
]},
{t:"AI and automation", s:"Talk about AI credibly, evaluate use cases and govern them", days:[
 {t:"Generative AI fundamentals", k:["Large language models generate text by predicting likely next words; they work in tokens and have a limited context window.","Hallucination: confident output that is wrong. Grounding reduces it.","RAG (retrieval-augmented generation) grounds answers in your own documents; fine-tuning adapts a model with extra training.","Agents use tools to take actions; copilots assist inside existing products such as Microsoft 365 or GitHub."], ex:"Use an AI assistant to draft one status report from your notes. List what it got wrong and what context it would have needed.", say:"Is this answer grounded in our documents, or is the model generating from general knowledge?"},
 {t:"Evaluating an AI use case", k:["Score value (time saved, quality, revenue), feasibility (data, integration, skills), risk (accuracy, privacy, IP) and cost (licences, usage, run cost).","Define the baseline and success metrics before the pilot starts.","Keep a human in the loop where errors are costly.","Most AI pilots stall at scaling, usually on data, integration, change management or unclear ownership."], ex:"Score three AI ideas from your team from 1 to 5 on value, feasibility and risk. Which one would you pilot first?", say:"What's the baseline today, so we can prove the pilot actually moved it?"},
 {t:"AI governance", k:["The EU AI Act sorts systems by risk tier, with obligations phasing in over several years.","ISO/IEC 42001 certifies an AI management system; NIST's AI Risk Management Framework is widely referenced.","In APAC, Singapore's Model AI Governance Framework is a common reference point, and other countries are issuing guidelines.","Acceptable-use policies define which tools are approved and which data classifications may go into them."], ex:"Find your organisation's AI acceptable-use policy. Summarise in three lines what it allows and what it forbids.", say:"Which data classification is allowed into this AI tool?"},
 {t:"Automation beyond AI", k:["RPA (UiPath, Power Automate) mimics clicks and keystrokes; workflow automation connects systems through APIs.","AIOps correlates alerts and can trigger automated fixes in operations.","ITSM automation includes virtual agents, auto-routing of tickets and self-service.","Every automation needs an owner and a maintenance budget; brittle bots fail when screens change."], ex:"List five repetitive tasks in your PMO week. Which could be automated with tools you already have?", say:"Automation saves time only if someone owns maintaining it."},
 {case:true, t:"Case: what are we doing with AI?", k:["The regional leadership team asks, 'What is APAC IS doing with AI?'","You have one week. Several teams are experimenting informally."], ex:"How do you build the inventory? What goes on a single slide? How do you show momentum without overpromising?", say:"Here are the pilots, what each has proved so far, and the two we recommend scaling."}
]},
{t:"Money and vendors", s:"Your finance strength, translated into IS language", days:[
 {t:"IT finance basics", k:["CapEx buys assets that are depreciated or amortised over years; OpEx is spent as incurred. Cloud and SaaS shift spend towards OpEx.","Some software development can be capitalised; the rules depend on accounting standards and company policy.","Total cost of ownership includes licences, infrastructure, support, upgrades, people and exit costs.","A project's run cost lands in someone's budget for years after go-live."], ex:"For one project, estimate five-year total cost of ownership, including run costs after go-live. Whose budget absorbs year two onwards?", say:"What's the run cost once this goes live, and whose budget absorbs it?"},
 {t:"FinOps and licensing", k:["FinOps is the practice of managing cloud spend collaboratively: inform, optimise, operate.","Tagging resources makes showback (showing cost) and chargeback (billing cost) possible.","Savings levers: rightsizing, shutting down idle resources, reserved instances and savings plans.","Licensing models: per user, per core, consumption, enterprise agreements. Watch for true-ups and vendor audits."], ex:"Find the top three cloud or licence cost drivers in your area. Which one has the most obvious saving?", say:"Is our tagging good enough to show back cloud cost by business unit?"},
 {t:"Contracts: MSA, SOW, SLA", k:["The MSA sets legal terms for the whole relationship; each SOW defines specific work, deliverables and acceptance criteria; change orders amend scope.","Commercial models: time and materials, fixed price, outcome-based.","Service credits compensate for SLA breaches but rarely cover the real business impact.","Exit clauses, knowledge transfer and key-person clauses protect you when things go wrong."], ex:"Read one active SOW. List its acceptance criteria, penalties and exit terms. Is anything vague enough to cause a dispute?", say:"What are the acceptance criteria in the SOW, and who signs them off?"},
 {t:"Vendor governance and performance", k:["Tier vendors by spend and criticality; govern each tier differently.","Quarterly business reviews should look at trends and improvement plans, not argue over individual tickets.","SIAM (service integration and management) coordinates multiple vendors as one service.","Your bid management experience is an asset: you know how vendors price, so you know where to probe."], ex:"Create a six-metric scorecard for your main support vendor, mixing SLA, quality, responsiveness and innovation.", say:"Let's review the scorecard trend in the QBR rather than individual incidents."},
 {case:true, t:"Case: a 15% cut mid-plan", k:["Next year's IS budget for APAC is cut by 15% midway through planning.","Twelve projects are in flight and three new ones were about to be approved."], ex:"What prioritisation framework do you use? What do you protect and why? How do you communicate the outcome to project sponsors?", say:"Here's what we stop, what we slow, and what we protect, and the business impact of each."}
]},
{t:"Portfolio governance", s:"The core PMO craft: prioritise, control, report, realise value", days:[
 {t:"Portfolio prioritisation", k:["A single intake process stops work sneaking in through side doors.","Score requests on strategic fit, value, risk and effort; SAFe's WSJF divides cost of delay by job size.","Plan against real capacity, not wishful headcount.","Prioritisation means agreeing what not to do."], ex:"Score your current pipeline with a simple four-criteria model. Does the ranking match what teams are actually working on?", say:"If this comes in, what comes out? Capacity is fixed this quarter."},
 {t:"RAID, dependencies and escalation", k:["RAID logs track risks, assumptions, issues and dependencies.","A risk might happen; an issue already has. Risk exposure is roughly probability times impact.","Every item needs an owner, an action and a date, or it's just a list of worries.","Tolerances define when something escalates and to whom."], ex:"Clean up one project's RAID log: close stale items, add owners and dates, and flag anything past tolerance.", say:"This risk has been amber for six weeks with no action. It needs an owner and a date, or we formally accept it."},
 {t:"Status reporting and steering committees", k:["Lead with the bottom line (BLUF): status, trend and the decision needed.","Pre-wire key stakeholders so the meeting confirms decisions rather than surprising people.","Design steering committees around decisions, not status readouts.","Minutes record decisions, actions, owners and dates. Nothing else matters as much."], ex:"Rewrite your last status update in BLUF format: three lines plus one decision needed.", say:"There's one decision I need from this group today."},
 {t:"Benefits realisation and PMO value", k:["Define benefits up front, with an owner and a measurement plan that continues after go-live.","OKRs link portfolio work to outcomes rather than outputs.","PMOs range from supportive to controlling to directive; mature ones act as value delivery offices.","Tools you'll hear: Jira Align, ServiceNow SPM, Planview, Smartsheet, Microsoft Project and Planner."], ex:"For one completed project, check whether its business case benefits were ever measured. If not, what would it take now?", say:"Who owns this benefit after go-live, and when do we measure it?"},
 {case:true, t:"Case: the empty steering committee", k:["Steering committee meetings have become status-reading sessions.","Executives send delegates or skip them entirely, and decisions are made in corridors instead."], ex:"Redesign the forum: purpose, attendees, pre-reads, agenda, length and how decisions are recorded. What do you stop doing?", say:"From next month, this forum is for decisions only. Status goes in the pre-read."}
]},
{t:"Leading across APAC", s:"Culture, influence, change and your next career step", days:[
 {t:"Culture and communication across APAC", k:["High-context cultures rely on implicit meaning and relationships; low-context cultures spell things out. Erin Meyer's Culture Map is a practical guide.","Feedback directness and comfort with disagreeing upward vary widely across Australia, India, Singapore, Japan, China and South-East Asia.","Silence on a call rarely means agreement. Confirm in writing.","Rotate meeting times so the same country isn't always on at the edge of the day."], ex:"For each country in your remit, note the best overlap window and who may not speak up on calls. How will you hear from them?", say:"Let me summarise what I heard and send it in writing. Please correct anything I've got wrong."},
 {t:"Influence without authority", k:["Map stakeholders by power and interest, and know what each is measured on.","Frame requests in their goals, not yours.","Pre-wire important decisions one to one before the group meeting.","Combine data with a short story; escalate only when it serves the outcome."], ex:"Pick one stakeholder who resists you. Write down what they gain from saying yes and what they fear losing.", say:"What would need to be true for you to support this?"},
 {t:"Change management", k:["ADKAR: Awareness, Desire, Knowledge, Ability, Reinforcement. Adoption stalls at the weakest stage.","Kotter's eight steps start with urgency and a guiding coalition.","Change champions in each country carry the message in local context.","Adoption is the real go-live: track usage at 30, 60 and 90 days."], ex:"Rate one recent rollout on each ADKAR stage. Where is it stuck, and what single action would unblock it?", say:"Adoption is our real go-live. Let's track usage at 30, 60 and 90 days."},
 {t:"Your career architecture", k:["Credentials worth weighing: PMP now, PgMP later; ITIL 4 Foundation; a SAFe certification; cloud fundamentals such as Azure AZ-900 or AWS Cloud Practitioner; PMI-CPMAI for AI projects.","Visible wins matter more than certificates: a measurable process improvement, a portfolio insight that changed a decision.","Next roles to aim at: Head of PMO, Portfolio Director, IT Business Partner, Head of Digital Delivery.","Your edge is rare: engineering, finance and M&A thinking applied to technology delivery."], ex:"Write an 18-month plan: one certification, two visible wins, three relationships to build.", say:"Here's what our portfolio delivered this quarter, and here's what I'd change next quarter."},
 {case:true, t:"Case: the skip-level question", k:["In a skip-level conversation, your manager's manager asks: 'Where do you want to be in three years, and what's your plan?'"], ex:"Prepare a two-minute answer: where you want to be, why you're credible for it, what you're doing now, and what support you'd ask for.", say:"In three years I want to lead portfolio delivery across APAC. Here's the evidence I'm building towards it."}
]}
];

const CARDS = [
[1,"Application portfolio","The full inventory of applications: owner, users, cost, technology, support model and lifecycle status.","Your map for prioritisation, rationalisation and risk. If it's out of date, so is every decision built on it."],
[1,"Run vs change","Run keeps existing services working; change builds, upgrades or retires them.","Every change project creates future run cost. Ask for it before approval."],
[1,"L1 / L2 / L3 support","L1 service desk triages, L2 application support diagnoses, L3 developers or vendors fix code.","Slow resolutions usually hide in the handoffs between tiers."],
[1,"UAT","User acceptance testing: the business confirms the solution works for real tasks before go-live.","No business sign-off on UAT means no go-live."],
[1,"Production","The live environment real users depend on.","Anything touching production needs a change record and a rollback plan."],
[1,"Technical debt","The future cost of shortcuts taken today.","Treat it as a risk with a business impact, not as an engineering complaint."],
[1,"API","A contract that lets one system request data or actions from another.","API changes ripple to every consuming system; ask who is downstream."],
[1,"Microservices","An architecture of many small, independently deployed services instead of one large application.","More release flexibility, but more dependencies and monitoring to manage."],
[2,"Sprint","A fixed timebox, usually two weeks, in which a team delivers a usable increment.","Plan and report in sprint cadence; mid-sprint scope changes are disruptive."],
[2,"Product Owner","The person accountable for what the team builds and in what order.","Your key partner for scope and priority trade-offs."],
[2,"Velocity","Story points a team completes per sprint.","Useful for one team's forecasting. Never compare velocity across teams."],
[2,"Story points","A relative estimate of effort and complexity, not hours.","Don't convert them to days in reports; use them for trends."],
[2,"Backlog refinement","Ongoing work to clarify, split and estimate upcoming backlog items.","A thin refined backlog predicts a messy next sprint."],
[2,"WIP limit","A cap on how many items can be in progress at once.","Lower WIP usually shortens delivery time more than adding people."],
[2,"Lead time","Time from a request being made to it being delivered.","The number the business actually feels. Track its trend."],
[2,"PI Planning","SAFe's event where all teams on a release train plan the next 8 to 12 weeks together.","The best moment to surface and commit on cross-team dependencies."],
[3,"Incident","An unplanned interruption or degradation of a service.","Measure time to restore and how well you communicated."],
[3,"Problem","The underlying cause of one or more incidents.","Recurring incidents without a problem record are a governance gap."],
[3,"Standard change","A low-risk, repeatable change that is pre-approved.","Moving routine changes to standard frees the CAB for real risk."],
[3,"CAB","Change Advisory Board: reviews and approves higher-risk changes.","Bring a clear risk, impact and rollback summary, or expect delay."],
[3,"SLA","Service level agreement: a committed service target to the customer.","Check what it measures, not just whether it's green."],
[3,"OLA","Operational level agreement: internal commitments between teams that support an SLA.","When an SLA fails, look for the OLA that broke first."],
[3,"Watermelon metric","A measure that looks green while users experience red.","Pair SLAs with user-side measures such as satisfaction or repeat contacts."],
[3,"Post-incident review","A blameless analysis after a major incident to prevent recurrence.","Insist on actions with owners and dates, then track them."],
[4,"SaaS","Software as a service: you use a vendor-run application over the internet.","Less to run, more to govern: configuration, access, data and the vendor."],
[4,"IaaS","Infrastructure as a service: rented virtual machines, storage and networks.","You still own patching, security and operations above the infrastructure."],
[4,"PaaS","Platform as a service: the provider runs the runtime; you bring the code.","Faster delivery, with some lock-in to the provider's platform."],
[4,"Availability zone","A separate data centre within a cloud region.","Running across zones protects against a single site failure."],
[4,"RTO","Recovery time objective: how quickly a service must be restored.","Ask for it and when it was last tested."],
[4,"RPO","Recovery point objective: how much data loss is acceptable, measured in time.","An RPO of four hours means up to four hours of transactions could be lost."],
[4,"Lift and shift","Rehosting an application in the cloud with minimal changes.","Fast, but often expensive to run unless optimised afterwards."],
[4,"Landing zone","A pre-built, governed cloud foundation that applications are deployed into.","No landing zone usually means every migration reinvents security and networking."],
[4,"SSO","Single sign-on: one login gives access to many applications.","Better security and fewer access tickets. Ask whether new apps support it."],
[5,"CI/CD","Continuous integration and delivery: automated build, test and release pipelines.","More automation means smaller, safer, more frequent releases."],
[5,"Pull request","A proposed code change that others review before it's merged.","Long-waiting pull requests are a hidden delay in delivery."],
[5,"Feature flag","A switch that turns functionality on or off without redeploying.","Lets you release to one country or user group first."],
[5,"Canary release","Releasing to a small share of users first, then expanding.","Limits the blast radius of a bad release."],
[5,"Blue-green deployment","Two identical environments; traffic switches from old to new.","Near-instant rollback by switching back."],
[5,"Rollback","Reverting to the previous working version.","Every go/no-go should confirm the rollback was tested."],
[5,"DORA metrics","Deployment frequency, lead time for changes, change failure rate, time to restore.","Better delivery health signals than hours or task counts."],
[5,"Observability","Understanding a system's behaviour from its logs, metrics and traces.","Weak observability means slow diagnosis in every incident."],
[5,"Hypercare","A period of heightened support straight after go-live.","Agree its length, exit criteria and handover to BAU support up front."],
[6,"ERP","Enterprise resource planning: the core system for finance, procurement and supply chain.","ERP programmes are multi-year and touch every function; governance is everything."],
[6,"CRM","Customer relationship management: systems for sales, service and customer data.","Ask who owns customer master data across CRM and ERP."],
[6,"System of record","The authoritative source for a type of data.","Two systems of record for one data type guarantees reconciliation pain."],
[6,"iPaaS","Integration platform as a service, such as MuleSoft or Boomi.","Centralises integrations; check who owns and supports it."],
[6,"Master data","Shared core data: customers, suppliers, materials, employees, accounts.","Poor master data quietly breaks reports, integrations and AI."],
[6,"Cutover","The planned switch from old system to new, run hour by hour.","Needs a runbook, go/no-go points and a rollback route."],
[6,"Clean core","Keeping an ERP close to standard, with extensions built outside it.","Cheaper, faster upgrades. Challenge every core customisation."],
[6,"TIME model","Tolerate, Invest, Migrate, Eliminate: a way to classify applications.","A simple lens for rationalisation conversations with business owners."],
[7,"Data warehouse","A structured, modelled store of data optimised for reporting.","Where most trusted management reporting should come from."],
[7,"Data lake","A store of raw data in many formats.","Without governance it becomes a data swamp."],
[7,"Lakehouse","A platform combining data lake flexibility with warehouse structure.","Common in Databricks and Microsoft Fabric conversations."],
[7,"ETL / ELT","Extract, transform, load (or load, then transform): how data moves into analytics platforms.","Pipeline failures are why dashboards go stale."],
[7,"Data lineage","The trail showing where data came from and how it changed.","The fastest way to settle 'why don't these numbers match?'"],
[7,"Data steward","The person managing definitions and quality for a data domain.","Find them before arguing about a metric."],
[7,"Semantic layer","A shared layer of business definitions over the data, such as what 'active user' means.","One definition, used by every report."],
[7,"Leading indicator","A measure that predicts future results.","Carry-over, scope growth and open risks warn you before milestones slip."],
[8,"CIA triad","Confidentiality, integrity and availability: the three goals of information security.","A quick way to frame any security risk conversation."],
[8,"Zero trust","Never trust, always verify: every access request is checked, wherever it comes from.","Expect stronger identity checks and segmentation in new projects."],
[8,"MFA","Multi-factor authentication: a second proof of identity beyond the password.","Should be standard for every application, especially admin access."],
[8,"Least privilege","Giving people only the access they need, for as long as they need it.","Ask how access is granted and removed, not just who has it."],
[8,"CVE","A public identifier for a known security vulnerability.","A critical CVE in a key system can force an unplanned release."],
[8,"Patch SLA","The committed time to fix vulnerabilities by severity.","Plan release capacity around it."],
[8,"SOC 2 Type II","An independent report on a service provider's controls, tested over a period.","Ask vendors for it before contract signature."],
[8,"ISO 27001","The international standard for an information security management system.","A baseline expectation for critical vendors."],
[8,"Data residency","Requirements on where data is physically stored.","Can change cloud region and architecture choices in APAC."],
[8,"Segregation of duties","No one person controls a full sensitive process end to end.","Auditors test this in ERP and finance systems."],
[9,"LLM","Large language model: AI that generates text by predicting likely next words.","Powerful but probabilistic. Plan for review and verification."],
[9,"Hallucination","Confident but incorrect AI output.","Why human review and grounding matter in business use."],
[9,"RAG","Retrieval-augmented generation: the model answers using retrieved company documents.","The usual pattern for enterprise knowledge assistants."],
[9,"AI agent","An AI system that uses tools and takes actions towards a goal.","Needs clear permissions, logging and human checkpoints."],
[9,"Human-in-the-loop","A person reviews or approves AI output before it takes effect.","Essential where errors are costly or regulated."],
[9,"RPA","Robotic process automation: software bots that mimic user clicks and keystrokes.","Quick wins, but brittle when screens change. Budget for maintenance."],
[9,"AIOps","Using AI to correlate IT alerts and automate operational responses.","Can cut alert noise and speed up incident diagnosis."],
[9,"ISO 42001","The international standard for an AI management system.","A signal of mature AI governance in vendors."],
[10,"CapEx","Capital expenditure on assets, depreciated or amortised over time.","Affects how projects are funded and how benefits are reported."],
[10,"OpEx","Operating expenditure, expensed as incurred.","Cloud and SaaS move spend here; check budget ownership."],
[10,"TCO","Total cost of ownership across the full lifecycle.","Compare options on five-year TCO, not purchase price."],
[10,"FinOps","The discipline of managing cloud spend collaboratively across finance, tech and business.","Brings your FP&A skills straight into cloud conversations."],
[10,"Showback vs chargeback","Showback shows teams their costs; chargeback bills them.","Showback first builds trust before money moves."],
[10,"True-up","A periodic reconciliation where you pay for licence usage above what you bought.","Unbudgeted true-ups are a classic year-end surprise."],
[10,"SOW","Statement of work: the specific deliverables, timeline and acceptance criteria under a contract.","Vague acceptance criteria cause most vendor disputes."],
[10,"Service credit","A contractual payment or discount when a vendor misses an SLA.","Rarely covers real impact; better as a signal than as compensation."],
[10,"SIAM","Service integration and management: coordinating multiple vendors as one service.","Relevant when several vendors share responsibility for one outcome."],
[11,"WSJF","Weighted shortest job first: cost of delay divided by job size.","A defensible way to rank competing requests."],
[11,"RAID log","A register of risks, assumptions, issues and dependencies.","Items without owners and dates are just worries."],
[11,"BLUF","Bottom line up front: lead with the conclusion and the decision needed.","The single most useful habit for executive updates."],
[11,"Tolerance","The agreed range of deviation before something must be escalated.","Makes escalation predictable instead of personal."],
[11,"Benefits realisation","Measuring whether a project delivered its promised value after go-live.","Where PMOs prove their own value."],
[11,"OKR","Objectives and key results: a goal plus measurable outcomes.","Links portfolio work to outcomes, not output."],
[11,"Stage gate","A formal decision point between project phases.","Gates should be able to stop projects, not just stamp them."],
[11,"Dependency","Work one team needs from another before it can proceed.","Most cross-team delays start as unmanaged dependencies."],
[12,"High-context communication","Meaning carried by relationship, tone and what's left unsaid.","Confirm agreements in writing across APAC teams."],
[12,"ADKAR","Awareness, Desire, Knowledge, Ability, Reinforcement: stages of individual change.","Find the stage where adoption is stuck."],
[12,"Change champion","A local advocate who supports adoption in their team or country.","Your force multiplier across time zones."],
[12,"Pre-wiring","Socialising a proposal one to one before the decision meeting.","Turns meetings into confirmations instead of debates."],
[12,"Stakeholder map","A grid of stakeholders by power and interest.","Decides who you manage closely and who you keep informed."],
[12,"Psychological safety","A shared belief that it's safe to raise problems and admit mistakes.","Without it, red status arrives late."]
].map((c,i)=>({id:"c"+i, m:c[0], t:c[1], d:c[2], p:c[3]}));
